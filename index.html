<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#0f1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Carnet Irlande">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Carnet de voyage — Irlande 2026</title>
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --panel2:#1e222b; --border:#2a2f3a;
    --text:#e9ecf1; --muted:#8b93a3; --accent:#3ddc84; --accent2:#4da3ff;
    --warn:#ffb84d; --danger:#ff6b6b; --resto:#ffb84d;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    overscroll-behavior-y:none; height:100%;}
  body{display:flex; flex-direction:column; height:100dvh;}
  a{color:inherit;}
  button{font-family:inherit; cursor:pointer; border:none; -webkit-user-select:none; user-select:none;}
  .hidden{display:none !important;}

  /* ---------- Header ---------- */
  header{
    flex-shrink:0; background:var(--panel); border-bottom:1px solid var(--border);
    padding-top:calc(var(--safe-top) + 8px);
  }
  .trip-title{font-size:14px; font-weight:700; text-align:center; padding:0 12px 8px; color:var(--muted); letter-spacing:.3px;}
  .day-strip{display:flex; overflow-x:auto; gap:6px; padding:0 10px 10px; scroll-behavior:smooth; -webkit-overflow-scrolling:touch;}
  .day-strip::-webkit-scrollbar{display:none;}
  .day-chip{
    flex-shrink:0; min-width:52px; padding:6px 8px; border-radius:12px; background:var(--panel2);
    border:1px solid var(--border); text-align:center; font-size:11px; color:var(--muted);
  }
  .day-chip .dnum{font-size:15px; font-weight:800; color:var(--text); display:block;}
  .day-chip.active{background:var(--accent); border-color:var(--accent); color:#08130d;}
  .day-chip.active .dnum{color:#08130d;}
  .day-chip.today-marker{box-shadow:0 0 0 2px var(--accent2) inset;}

  .day-nav{display:flex; align-items:center; justify-content:space-between; padding:0 10px 10px; gap:8px;}
  .day-nav button{
    background:var(--panel2); border:1px solid var(--border); color:var(--text);
    border-radius:10px; padding:8px 14px; font-size:16px; flex-shrink:0;
  }
  .day-nav .day-label{flex:1; text-align:center;}
  .day-nav .day-label .big{font-size:16px; font-weight:800;}
  .day-nav .day-label .sub{font-size:12px; color:var(--muted);}

  /* ---------- Main scroll area ---------- */
  main{flex:1; overflow-y:auto; padding:12px 12px calc(90px + var(--safe-bottom));  -webkit-overflow-scrolling:touch;}

  .card{background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:14px; margin-bottom:12px;}
  .card h3{margin:0 0 10px; font-size:13px; text-transform:uppercase; letter-spacing:.5px; color:var(--muted); display:flex; align-items:center; gap:6px;}
  .card.hero{background:linear-gradient(160deg, #1c2b22, var(--panel)); border-color:#2c4a37;}
  .card.hero.ferry{background:linear-gradient(160deg, #17242f, var(--panel)); border-color:#294356;}

  .big-btn{
    display:flex; align-items:center; justify-content:center; gap:8px;
    width:100%; padding:15px; border-radius:12px; font-size:16px; font-weight:700;
    background:var(--accent); color:#08130d; margin-bottom:8px;
  }
  .big-btn.blue{background:var(--accent2); color:#081522;}
  .big-btn.ghost{background:var(--panel2); color:var(--text); border:1px solid var(--border);}
  .btn-row{display:flex; gap:8px;}
  .btn-row .big-btn{margin-bottom:0;}

  .info-line{display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-bottom:1px solid var(--border); gap:10px;}
  .info-line:last-child{border-bottom:none;}
  .info-line .label{font-size:12px; color:var(--muted);}
  .info-line .value{font-size:15px; font-weight:600; text-align:right;}
  .copy-btn{background:var(--panel2); border:1px solid var(--border); color:var(--text); border-radius:8px; padding:5px 10px; font-size:12px; flex-shrink:0;}
  .copy-btn.copied{background:var(--accent); color:#08130d; border-color:var(--accent);}

  .lang-toggle{display:flex; gap:6px; margin-bottom:12px;}
  .lang-toggle button{flex:1; padding:9px; border-radius:9px; background:var(--panel2); border:1px solid var(--border); color:var(--muted); font-size:13px; font-weight:700;}
  .lang-toggle button.active{background:var(--accent2); color:#081522; border-color:var(--accent2);}

  .item-card{background:var(--panel2); border:1px solid var(--border); border-radius:12px; padding:12px; margin-bottom:10px;}
  .item-card.done{opacity:.45;}
  .item-top{display:flex; justify-content:space-between; align-items:flex-start; gap:8px;}
  .item-name{font-size:15px; font-weight:700;}
  .item-name.strike{text-decoration:line-through;}
  .item-badges{display:flex; gap:5px; flex-wrap:wrap; margin:5px 0;}
  .pill{font-size:10px; padding:3px 7px; border-radius:20px; font-weight:700; white-space:nowrap;}
  .pill.dur-s{background:#1f3a2a; color:#5fe08a;}
  .pill.dur-m{background:#3a2f1a; color:#ffcb70;}
  .pill.dur-l{background:#3a1a1a; color:#ff8f8f;}
  .pill.indoor{background:#1a2c3a; color:#7fc3ff;}
  .pill.outdoor{background:#233a1a; color:#a9e07f;}
  .pill.resto{background:#3a2a12; color:var(--resto);}
  .item-desc{font-size:12.5px; color:var(--muted); margin:6px 0; line-height:1.4;}
  .item-actions{display:flex; gap:6px; margin-top:8px; flex-wrap:wrap;}
  .item-actions button, .item-actions a{
    font-size:12.5px; padding:7px 11px; border-radius:8px; background:var(--panel); border:1px solid var(--border); color:var(--text);
    text-decoration:none; display:inline-flex; align-items:center; gap:4px;
  }
  .check-btn{background:var(--panel) !important;}
  .check-btn.on{background:var(--accent) !important; color:#08130d !important; border-color:var(--accent) !important;}

  .nearby-wrap{margin-top:8px; padding-top:8px; border-top:1px dashed var(--border);}
  .nearby-head{font-size:11px; color:var(--resto); font-weight:700; margin-bottom:6px;}
  .nearby-item{background:var(--panel); border-radius:9px; padding:8px 10px; margin-bottom:6px; font-size:13px;}
  .nearby-item .n-name{font-weight:700;}
  .nearby-item .n-desc{color:var(--muted); font-size:11.5px; margin-top:3px; line-height:1.35;}
  .nearby-item a{color:var(--accent2); font-size:11.5px;}

  .empty-note{font-size:13px; color:var(--muted); text-align:center; padding:14px;}
  .section-toggle{display:flex; gap:8px; margin-bottom:10px;}
  .section-toggle button{flex:1; padding:8px; border-radius:9px; background:var(--panel2); border:1px solid var(--border); color:var(--muted); font-size:12.5px; font-weight:700;}
  .section-toggle button.active{background:var(--panel); color:var(--text); border-color:var(--accent2);}

  /* Planning / timeline */
  .step-block{background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:14px; margin-bottom:10px;}
  .step-block.current{border-color:var(--accent);}
  .step-block .st-top{display:flex; justify-content:space-between; align-items:center;}
  .step-block .st-name{font-weight:800; font-size:15px;}
  .step-block .st-dates{font-size:12px; color:var(--muted);}
  .step-block .st-meta{font-size:12.5px; color:var(--muted); margin-top:6px;}
  .step-block .st-days{display:flex; gap:5px; margin-top:8px; flex-wrap:wrap;}
  .step-block .st-days span{
    font-size:11px; padding:4px 8px; border-radius:8px; background:var(--panel2); border:1px solid var(--border); color:var(--muted);
  }
  .step-block .st-days span.today{background:var(--accent); color:#08130d; border-color:var(--accent); font-weight:800;}

  /* Restos tab filter */
  .resto-filter{display:flex; gap:6px; overflow-x:auto; padding-bottom:10px; margin-bottom:8px;}
  .resto-filter button{flex-shrink:0; padding:7px 12px; border-radius:20px; background:var(--panel2); border:1px solid var(--border); color:var(--muted); font-size:12.5px;}
  .resto-filter button.active{background:var(--resto); color:#2a1c05; border-color:var(--resto); font-weight:700;}

  /* Modal (reception mode) */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(0,0,0,.6); display:flex; align-items:flex-end; z-index:50;
  }
  .modal-overlay.hidden{display:none;}
  .modal-sheet{
    background:var(--panel); border-radius:20px 20px 0 0; padding:18px 18px calc(18px + var(--safe-bottom)); width:100%; max-height:88vh; overflow-y:auto;
  }
  .modal-sheet .m-close{width:36px; height:4px; background:var(--border); border-radius:3px; margin:0 auto 14px; }
  .modal-sheet h2{margin:0 0 4px; font-size:19px;}
  .modal-sheet .m-sub{font-size:12.5px; color:var(--muted); margin-bottom:14px;}

  /* Bottom tab bar */
  nav.tabbar{
    position:fixed; left:0; right:0; bottom:0; z-index:40;
    display:flex; background:var(--panel); border-top:1px solid var(--border);
    padding-bottom:var(--safe-bottom);
  }
  nav.tabbar button{
    flex:1; background:none; padding:10px 4px 8px; display:flex; flex-direction:column; align-items:center; gap:3px;
    color:var(--muted); font-size:10.5px; font-weight:700;
  }
  nav.tabbar button .ic{font-size:20px;}
  nav.tabbar button.active{color:var(--accent);}

  .swipe-area{touch-action:pan-y;}
</style>
</head>
<body>

<header>
  <div class="trip-title" id="tripTitle">Irlande — Août 2026</div>
  <div class="day-strip" id="dayStrip"></div>
  <div class="day-nav">
    <button id="prevDay">‹</button>
    <div class="day-label">
      <div class="big" id="dayBig">—</div>
      <div class="sub" id="daySub">—</div>
    </div>
    <button id="nextDay">›</button>
  </div>
</header>

<main id="view" class="swipe-area"></main>

<nav class="tabbar">
  <button data-tab="today" class="active"><span class="ic">📍</span>Aujourd'hui</button>
  <button data-tab="planning"><span class="ic">🗺️</span>Planning</button>
  <button data-tab="restos"><span class="ic">🍽️</span>Restos</button>
</nav>

<div class="modal-overlay hidden" id="modalOverlay">
  <div class="modal-sheet" id="modalSheet"></div>
</div>

Food Pass inclus (retour).","hotel":null}],"items":[{"id":"i1","type":"activite","name":"Château de Kilkenny","mapsLink":"https://www.google.com/maps/search/?api=1&query=Ch%C3%A2teau+de+Kilkenny+Ireland","image":"","description":"Château historique en plein centre-ville, 4,7★ (15 010 avis). Jardins et parc attenant.","duration":90,"link":{"kind":"step","stepId":"s7"},"indoor":true},{"id":"i2","type":"activite","name":"Rock of Cashel","mapsLink":"https://www.google.com/maps/search/?api=1&query=Rock+of+Cashel+Ireland","image":"","description":"Site historique majeur du Tipperary, 4,6★ (17 115 avis). ~45 min de Kilkenny.","duration":90,"link":{"kind":"step","stepId":"s7"},"indoor":false},{"id":"i3","type":"activite","name":"Brú na Bóinne","mapsLink":"https://www.google.com/maps/search/?api=1&query=Br%C3%BA+na+B%C3%B3inne+Ireland","image":"","description":"Newgrange + Knowth. ⚠️ RÉSERVATION OBLIGATOIRE en août, ouverture des créneaux à J-30 (billets en ligne chaque nuit à minuit) — aucun billet sur place. Compter ~3h et non 1h. Famille 48 €, gratuit <12 ans (mais tout le monde doit figurer sur la résa). Couloir bas et étroit.","duration":180,"link":{"kind":"transit","fromStepId":"s6","toStepId":"s7"},"indoor":true},{"id":"i4","type":"activite","name":"Belfast","mapsLink":"https://www.google.com/maps/search/?api=1&query=Belfast+Ireland","image":"","description":"Titanic Belfast, jardins botaniques, murals. ⚠️ Furkot n'y prévoit qu'1h : irréaliste, le Titanic seul demande 2-3h. Compter une demi-journée. ~40 min de Ballymena.","duration":240,"link":{"kind":"step","stepId":"s6"},"indoor":true},{"id":"i5","type":"activite","name":"Château de Bunratty","mapsLink":"https://www.google.com/maps/search/?api=1&query=Ch%C3%A2teau+de+Bunratty+Ireland","image":"","description":"Château + folk park, 4,6★ (15 564 avis). Proche d'Ennis.","duration":120,"link":{"kind":"step","stepId":"s3"},"indoor":true},{"id":"i6","type":"activite","name":"Killarney (ville et lacs)","mapsLink":"https:// const LS_DONE = "carnetDoneItems_v1";
const LS_DAY  = "carnetLastDay_v1";
const LS_LANG = "carnetLang_v1";

let doneItems = new Set(JSON.parse(localStorage.getItem(LS_DONE) || "[]"));
let lang = localStorage.getItem(LS_LANG) || "fr";
let currentTab = "today";
let indoorFilter = "all"; // all | indoor
let restoFilterStepId = "all";

function saveDone(){ localStorage.setItem(LS_DONE, JSON.stringify([...doneItems])); }
function esc(s){ return (s||"").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

// =====================================================================
// Build the day-by-day itinerary from steps' arrival/departure ranges
// =====================================================================
function parseDate(s){ const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); }
function fmtISO(d){ return d.toISOString ? isoLocal(d) : d; }
function isoLocal(d){
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,"0"), day=String(d.getDate()).padStart(2,"0");
  return `${y}-${m}-${day}`;
}
const WEEKDAYS = ["dim.","lun.","mar.","mer.","jeu.","ven.","sam."];
const MONTHS = ["jan.","fév.","mars","avr.","mai","juin","juil.","août","sept.","oct.","nov.","déc."];
function fmtDayLabel(d){
  return `${WEEKDAYS[d.getDay()]} ${d.getDate()} ${MONTHS[d.getMonth()]}`;
}

function buildDays(){
  const steps = TRIP.steps;
  if(!steps.length) return [];
  const first = parseDate(steps[0].arrival);
  const last = parseDate(steps[steps.length-1].departure);
  const days = [];
  for(let d = new Date(first); d <= last; d.setDate(d.getDate()+1)){
    const iso = isoLocal(d);
    let step = steps.find(s => iso >= s.arrival && iso < s.departure);
    if(!step) step = steps[steps.length-1]; // dernier jour = departure du dernier step
    const isArrival = iso === step.arrival;
    const prevStep = (() => {
      const idx = steps.indexOf(step);
      return idx > 0 ? steps[idx-1] : null;
    })();
    const isTravelDay = isArrival && prevStep !== null;
    days.push({
      date: new Date(d), iso, step, isArrival, isTravelDay,
      prevStep: isTravelDay ? prevStep : null
    });
  }
  return days;
}
const DAYS = buildDays();

function todayIndex(){
  const now = isoLocal(new Date());
  let idx = DAYS.findIndex(d => d.iso === now);
  if(idx === -1){
    if(DAYS.length && now < DAYS[0].iso) idx = 0;
    else idx = DAYS.length - 1;
  }
  return idx;
}

let dayIdx = (() => {
  const saved = localStorage.getItem(LS_DAY);
  if(saved !== null){
    const n = Number(saved);
    if(n >= 0 && n < DAYS.length) return n;
  }
  return todayIndex();
})();

// =====================================================================
// Helpers on TRIP data
// =====================================================================
function stepById(id){ return TRIP.steps.find(s=>s.id===id); }
function itemById(id){ return TRIP.items.find(i=>i.id===id); }
function itemsForStep(stepId){ return TRIP.items.filter(i=>i.link && i.link.kind==="step" && i.link.stepId===stepId); }
function itemsForTransit(fromId,toId){ return TRIP.items.filter(i=>i.link && i.link.kind==="transit" && i.link.fromStepId===fromId && i.link.toStepId===toId); }
function restosNearActivity(activityId){ return TRIP.items.filter(i=>i.link && i.link.kind==="activite" && i.link.itemId===activityId); }
function isFerryStep(step){ return !step.hotel; }

function durPill(min){
  if(!min) return "";
  let cls = "dur-s", label = min+" min";
  if(min > 150){ cls="dur-l"; label="Journée complète (~"+Math.round(min/60)+"h)"; }
  else if(min > 60){ cls="dur-m"; label="~"+Math.round(min/60*10)/10+"h"; }
  else { label = min+" min"; }
  return `<span class="pill ${cls}">⏱ ${label}</span>`;
}
function indoorPill(item){
  if(item.type !== "activite" || item.indoor === undefined) return "";
  return item.indoor ? `<span class="pill indoor">🏠 option abri</span>` : `<span class="pill outdoor">🌦️ plein air</span>`;
}

// =====================================================================
// Rendering: header (day strip + nav)
// =====================================================================
function renderHeader(){
  document.getElementById("tripTitle").textContent = TRIP.name || "Mon voyage";
  const strip = document.getElementById("dayStrip");
  const now = isoLocal(new Date());
  strip.innerHTML = DAYS.map((d,i) => {
    const cls = ["day-chip"];
    if(i===dayIdx) cls.push("active");
    if(d.iso===now) cls.push("today-marker");
    return `<button class="${cls.join(" ")}" data-day="${i}"><span class="dnum">${d.date.getDate()}</span>J${i+1}</button>`;
  }).join("");
  const cur = DAYS[dayIdx];
  document.getElementById("dayBig").textContent = cur ? `Jour ${dayIdx+1} — ${fmtDayLabel(cur.date)}` : "—";
  document.getElementById("daySub").textContent = cur ? cur.step.name : "—";
  document.getElementById("prevDay").disabled = dayIdx <= 0;
  document.getElementById("nextDay").disabled = dayIdx >= DAYS.length-1;
  document.getElementById("prevDay").style.opacity = dayIdx<=0 ? .3 : 1;
  document.getElementById("nextDay").style.opacity = dayIdx>=DAYS.length-1 ? .3 : 1;
  const activeChip = strip.querySelector(".day-chip.active");
  if(activeChip) activeChip.scrollIntoView({inline:"center", block:"nearest"});
}

// =====================================================================
// Bilingual labels for reservation modals
// =====================================================================
const L = {
  fr: { hotel:"Hôtel", ref:"N° de réservation", checkin:"Arrivée", checkout:"Départ", address:"Adresse",
        phone:"Téléphone", price:"Prix total", notes:"Notes", passengers:"Passagers", vehicle:"Véhicule",
        crossing:"Traversée", departure:"Départ", arrival:"Arrivée", cabin:"Cabine", copy:"Copier", copied:"Copié ✓",
        openMaps:"📍 Ouvrir dans Maps", showRes:"🏨 Voir la réservation", close:"Fermer" },
  en: { hotel:"Hotel", ref:"Booking reference", checkin:"Check-in", checkout:"Check-out", address:"Address",
        phone:"Phone", price:"Total price", notes:"Notes", passengers:"Passengers", vehicle:"Vehicle",
        crossing:"Crossing", departure:"Departure", arrival:"Arrival", cabin:"Cabin", copy:"Copy", copied:"Copied ✓",
        openMaps:"📍 Open in Maps", showRes:"🏨 Show booking", close:"Close" }
};

function copyToClipboard(text, btn){
  const done = () => {
    btn.textContent = (lang==="en"?L.en.copied:L.fr.copied);
    btn.classList.add("copied");
    setTimeout(()=>{ btn.textContent = (lang==="en"?L.en.copy:L.fr.copy); btn.classList.remove("copied"); }, 1600);
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(done);
  } else {
    const ta=document.createElement("textarea"); ta.value=text; document.body.appendChild(ta);
    ta.select(); try{document.execCommand("copy");}catch(e){} document.body.removeChild(ta); done();
  }
}

function openModal(html){
  document.getElementById("modalSheet").innerHTML = `<div class="m-close" data-close-modal></div>` + html;
  document.getElementById("modalOverlay").classList.remove("hidden");
  document.getElementById("modalSheet").querySelector("[data-close-modal]").addEventListener("click", closeModal);
}
function closeModal(){ document.getElementById("modalOverlay").classList.add("hidden"); }
document.getElementById("modalOverlay").addEventListener("click", (e) => {
  if(e.target.id === "modalOverlay") closeModal();
});

function hotelModal(step){
  const h = step.hotel;
  const t = L[lang];
  openModal(`
    <div class="lang-toggle">
      <button data-lang="fr" class="${lang==='fr'?'active':''}">🇫🇷 Français</button>
      <button data-lang="en" class="${lang==='en'?'active':''}">🇬🇧 English</button>
    </div>
    <h2>${esc(h.name)}</h2>
    <div class="m-sub">${esc(t.hotel)} — ${esc(step.name)}</div>
    <div class="card" style="margin:0;">
      ${h.bookingRef ? `<div class="info-line"><span class="label">${t.ref}</span><span class="value">${esc(h.bookingRef)}</span></div>` : ""}
      <div class="info-line"><span class="label">${t.checkin}</span><span class="value">${esc(h.checkIn)}</span></div>
      <div class="info-line"><span class="label">${t.checkout}</span><span class="value">${esc(h.checkOut)}</span></div>
      ${h.phone ? `<div class="info-line"><span class="label">${t.phone}</span><span class="value">${esc(h.phone)}</span></div>` : ""}
      <div class="info-line"><span class="label">${t.price}</span><span class="value">${esc(h.price)}</span></div>
      <div class="info-line"><span class="label">${t.address}</span><span class="value">${esc(h.address)}</span></div>
    </div>
    ${h.notes ? `<div class="item-desc" style="margin-top:8px;">${esc(h.notes)}</div>` : ""}
    <div class="btn-row" style="margin-top:14px;">
      <a class="big-btn" href="${esc(h.mapsLink)}" target="_blank" rel="noopener">${t.openMaps}</a>

    </div>
  `);

function ferryModal(step){
  const t = L[lang];
  openModal(`
    <div class="lang-toggle">
      <button data-lang="fr" class="${lang==='fr'?'active':''}">🇫🇷 Français</button>
      <button data-lang="en" class="${lang==='en'?'active':''}">🇬🇧 English</button>
    </div>
    <h2>⛴️ ${esc(step.name)}</h2>
    <div class="m-sub">${t.crossing} — Brittany Ferries</div>
    <div class="card" style="margin:0;">
      <div class="info-line"><span class="label">${t.departure}</span><span class="value">${esc(step.arrival)}</span></div>
      <div class="info-line"><span class="label">${t.arrival}</span><span class="value">${esc(step.departure)}</span></div>
    </div>
    <div class="item-desc" style="margin-top:10px; white-space:pre-line;">${esc(step.notes)}</div>
    <div class="btn-row" style="margin-top:14px;">
      <button class="big-btn ghost" id="copyRefBtn2">${t.copy} réf.</button>
    </div>

  document.getElementById("copyRefBtn2")?.addEventListener("click", (e) => copyToClipboard(refMatch, e.target));

    b.addEventListener("click", () => { lang = b.dataset.lang; localStorage.setItem(LS_LANG, lang); ferryModal(step); });

// =====================================================================
// Item card renderer (activity or resto), with optional nested restos
// =====================================================================
function renderItemCard(item, opts){
  opts = opts || {};
  const isDone = doneItems.has(item.id);
  const nested = item.type === "activite" ? restosNearActivity(item.id) : [];
  return `
  <div class="item-card ${isDone ? 'done':''}" data-item="${item.id}">
    <div class="item-top">
      <div class="item-name ${isDone?'strike':''}">${item.type==="resto"?"🍽️ ":"📍 "}${esc(item.name)}</div>
    </div>
    <div class="item-badges">
      ${item.type==="activite" ? durPill(item.duration) : `<span class="pill resto">Restaurant</span>`}
      ${indoorPill(item)}
    </div>
    ${item.description ? `<div class="item-desc">${esc(item.description)}</div>` : ""}
    <div class="item-actions">
      ${item.mapsLink ? `<a href="${esc(item.mapsLink)}" target="_blank" rel="noopener">📍 Maps</a>` : ""}
      <button class="check-btn ${isDone?'on':''}" data-toggle-done="${item.id}">${isDone? "✓ Fait" : "Marquer fait"}</button>
    </div>
    ${nested.length ? `
      <div class="nearby-wrap">
        <div class="nearby-head">🍽️ Où manger sur place</div>
        ${nested.map(r => `
          <div class="nearby-item">
            <div class="n-name">${esc(r.name)}</div>
            ${r.description ? `<div class="n-desc">${esc(r.description)}</div>` : ""}
            ${r.mapsLink ? `<a href="${esc(r.mapsLink)}" target="_blank" rel="noopener">📍 Voir sur Maps ↗</a>` : ""}
          </div>
        `).join("")}
      </div>
    ` : ""}
  </div>`;
}

function bindItemCardEvents(root){
  root.querySelectorAll("[data-toggle-done]").forEach(btn => {
    btn.addEventListener("click", () => {
      const id = btn.dataset.toggleDone;
      if(doneItems.has(id)) doneItems.delete(id); else doneItems.add(id);
      saveDone();
      renderView();
    });
  });
}

// =====================================================================
// TAB: Aujourd'hui
// =====================================================================
function renderToday(){
  const day = DAYS[dayIdx];
  if(!day) return `<div class="empty-note">Aucune étape définie.</div>`;
  const step = day.step;
  let html = "";

  // Jour de trajet (ferry ou route longue)
  if(day.isTravelDay){
    const from = day.prevStep;
    const transitItems = itemsForTransit(from.id, step.id);
    html += `<div class="card hero">
      <h3>🚗 Trajet du jour</h3>
      <div style="font-size:15px; font-weight:700; margin-bottom:4px;">${esc(from.name)} → ${esc(step.name)}</div>
      <div class="item-desc">Journée de route : reste large sur les horaires avec les enfants, prévois des pauses.</div>
    </div>`;
    if(transitItems.length){
      html += `<div class="card"><h3>🛣️ Étapes possibles en chemin</h3>`;
      transitItems.forEach(it => html += renderItemCard(it));
      html += `</div>`;
    }
  }

  // Ferry
  if(isFerryStep(step)){
    html += `<div class="card hero ferry">
      <h3>⛴️ ${esc(step.name)}</h3>
      <div class="item-desc">${esc((step.notes||"").split(". ").slice(0,2).join(". "))}.</div>
      <button class="big-btn blue" data-open-ferry="${step.id}">🎫 Voir la réservation (réf, cabine, passagers)</button>
    </div>`;
  }

  // Hôtel
  if(step.hotel){
    html += `<div class="card hero">
      <h3>🏨 Logement</h3>
      <div style="font-size:16px; font-weight:800; margin-bottom:8px;">${esc(step.hotel.name)}</div>
      <div class="btn-row">
        <a class="big-btn" href="${esc(step.hotel.mapsLink)}" target="_blank" rel="noopener">📍 Y aller</a>
        <button class="big-btn blue" data-open-hotel="${step.id}">🏨 Réservation</button>
      </div>
    </div>`;
  }

  // Activités du séjour (toutes celles liées à l'étape, jour après jour on coche)
  const acts = itemsForStep(step.id).filter(i=>i.type==="activite");
  if(acts.length){
    const filtered = indoorFilter === "indoor" ? acts.filter(a=>a.indoor) : acts;
    html += `<div class="card">
      <h3>🎯 Activités possibles ici</h3>
      <div class="section-toggle">
        <button data-indoor-filter="all" class="${indoorFilter==='all'?'active':''}">Toutes (${acts.length})</button>
        <button data-indoor-filter="indoor" class="${indoorFilter==='indoor'?'active':''}">🌧️ Si mauvais temps (${acts.filter(a=>a.indoor).length})</button>
      </div>
      ${filtered.length ? filtered.map(it=>renderItemCard(it)).join("") : `<div class="empty-note">Rien avec option abri ici — vérifie la météo avant de partir.</div>`}
    </div>`;
  }

  // Restos du soir (liés à l'étape, hors ceux "sur place" nichés)
  const restos = itemsForStep(step.id).filter(i=>i.type==="resto");
  html += `<div class="card">
    <h3>🍽️ Où manger ce soir</h3>
    ${restos.length ? restos.map(r=>renderItemCard(r)).join("") : `<div class="empty-note">Aucune adresse enregistrée ici pour l'instant.</div>`}
    <a class="big-btn ghost" style="margin-top:4px;" href="${esc(supermarketMapsLink(step))}" target="_blank" rel="noopener">🛒 Trouver un supermarché à proximité</a>
  </div>`;

  return html;
}

function supermarketMapsLink(step){
  const isNI = /Antrim|Northern Ireland|Belfast/i.test(step.name) || (step.hotel && /Northern Ireland/i.test(step.hotel.address||""));
  const q = isNI ? "supermarket" : "supermarché";
  return "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(q);
}

// =====================================================================
// TAB: Planning (vue d'ensemble)
// =====================================================================
function renderPlanning(){
  const now = isoLocal(new Date());
  let html = `<div class="empty-note" style="text-align:left; padding:2px 2px 12px;">Vue d'ensemble du voyage — touche une étape ou un jour pour t'y rendre.</div>`;
  TRIP.steps.forEach(step => {
    const stepDays = DAYS.map((d,i)=>({...d,i})).filter(d=>d.step.id===step.id);
    const isCurrent = stepDays.some(d=>d.i===dayIdx);
    html += `<div class="step-block ${isCurrent?'current':''}" data-jump-step="${step.id}">
      <div class="st-top">
        <div class="st-name">${isFerryStep(step)?"⛴️ ":"🏨 "}${esc(step.name)}</div>
        <div class="st-dates">${esc(step.arrival)} → ${esc(step.departure)}</div>
      </div>
      ${step.hotel ? `<div class="st-meta">${esc(step.hotel.name)} · ${esc(step.hotel.price)}</div>` : ""}
      <div class="st-days">
        ${stepDays.map(d => `<span class="${d.iso===now?'today':''} ${d.i===dayIdx?'today':''}" data-day="${d.i}">J${d.i+1} · ${d.date.getDate()}</span>`).join("")}
      </div>
    </div>`;
  });
  return html;
}

// =====================================================================
// TAB: Restos (liste complète filtrable)
// =====================================================================
function renderRestos(){
  const restos = TRIP.items.filter(i=>i.type==="resto");
  let html = `<div class="resto-filter">
    <button data-resto-filter="all" class="${restoFilterStepId==='all'?'active':''}">Tous (${restos.length})</button>
    ${TRIP.steps.map(s=>{
      const count = restos.filter(r => linkedToStep(r, s.id)).length;
      if(!count) return "";
      return `<button data-resto-filter="${s.id}" class="${restoFilterStepId===s.id?'active':''}">${esc(shortName(s.name))} (${count})</button>`;
    }).join("")}
  </div>`;
  const list = restoFilterStepId === "all" ? restos : restos.filter(r => linkedToStep(r, restoFilterStepId));
  html += list.length ? list.map(r=>renderItemCard(r)).join("") : `<div class="empty-note">Aucun resto pour ce filtre.</div>`;
  return html;
}
function shortName(name){ return name.split(" (")[0].split(" -")[0].split(" –")[0]; }
function linkedToStep(item, stepId){
  if(!item.link) return false;
  if(item.link.kind==="step") return item.link.stepId===stepId;
  if(item.link.kind==="transit") return item.link.fromStepId===stepId || item.link.toStepId===stepId;
  if(item.link.kind==="activite"){
    const act = itemById(item.link.itemId);
    return act && linkedToStep(act, stepId);
  }
  return false;
}

// =====================================================================
// Master render
// =====================================================================
function renderView(){
  const view = document.getElementById("view");
  if(currentTab === "today") view.innerHTML = renderToday();
  else if(currentTab === "planning") view.innerHTML = renderPlanning();
  else if(currentTab === "restos") view.innerHTML = renderRestos();
  bindItemCardEvents(view);
  bindViewEvents(view);
  renderHeader();
  localStorage.setItem(LS_DAY, String(dayIdx));
}

function bindViewEvents(view){
  view.querySelectorAll("[data-open-hotel]").forEach(b => b.addEventListener("click", () => hotelModal(stepById(b.dataset.openHotel))));
  view.querySelectorAll("[data-open-ferry]").forEach(b => b.addEventListener("click", () => ferryModal(stepById(b.dataset.openFerry))));
  view.querySelectorAll("[data-indoor-filter]").forEach(b => b.addEventListener("click", () => { indoorFilter = b.dataset.indoorFilter; renderView(); }));
  view.querySelectorAll("[data-resto-filter]").forEach(b => b.addEventListener("click", () => { restoFilterStepId = b.dataset.restoFilter; renderView(); }));
  view.querySelectorAll("[data-jump-step]").forEach(b => b.addEventListener("click", (e) => {
    if(e.target.closest("[data-day]")) return;
    const stepId = b.dataset.jumpStep;
    const idx = DAYS.findIndex(d=>d.step.id===stepId);
    if(idx>=0){ dayIdx = idx; goTab("today"); }
  }));
  view.querySelectorAll("[data-day]").forEach(b => b.addEventListener("click", (e) => {
    e.stopPropagation();
    dayIdx = Number(b.dataset.day);
    goTab("today");
  }));
}

function goTab(tab, push){
  currentTab = tab;
  document.querySelectorAll("nav.tabbar button").forEach(b => b.classList.toggle("active", b.dataset.tab===tab));
  renderView();
  document.getElementById("view").scrollTop = 0;
  if(push !== false) history.pushState({tab, dayIdx}, "", "#"+tab);
}

document.querySelectorAll("nav.tabbar button").forEach(b => b.addEventListener("click", () => goTab(b.dataset.tab)));
document.getElementById("dayStrip").addEventListener("click", (e) => {
  const chip = e.target.closest("[data-day]");
  if(chip){ dayIdx = Number(chip.dataset.day); renderView(); }
});
document.getElementById("prevDay").addEventListener("click", () => { if(dayIdx>0){ dayIdx--; renderView(); } });
document.getElementById("nextDay").addEventListener("click", () => { if(dayIdx<DAYS.length-1){ dayIdx++; renderView(); } });

window.addEventListener("popstate", (e) => {
  if(e.state){ currentTab = e.state.tab; dayIdx = e.state.dayIdx; }
  else { currentTab = "today"; }
  document.querySelectorAll("nav.tabbar button").forEach(b => b.classList.toggle("active", b.dataset.tab===currentTab));
  renderView();
});

// Swipe left/right on main to change day (only on "today" tab)
(function(){
  let sx=0, sy=0, tracking=false;
  const main = document.getElementById("view");
  main.addEventListener("touchstart", (e) => {
    if(currentTab!=="today") return;
    sx = e.touches[0].clientX; sy = e.touches[0].clientY; tracking = true;
  }, {passive:true});
  main.addEventListener("touchend", (e) => {
    if(!tracking) return; tracking = false;
    const dx = e.changedTouches[0].clientX - sx;
    const dy = e.changedTouches[0].clientY - sy;
    if(Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy)*1.5){
      if(dx < 0 && dayIdx < DAYS.length-1){ dayIdx++; renderView(); }
      else if(dx > 0 && dayIdx > 0){ dayIdx--; renderView(); }
    }
  }, {passive:true});
})();

// Init
history.replaceState({tab:"today", dayIdx}, "", "#today");
renderView();

// Service worker
if("serviceWorker" in navigator){
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(()=>{}));
}
</script>
