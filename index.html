<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#0f1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Carnet Irlande">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Carnet de voyage — Irlande 2026</title>
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --panel2:#1e222b; --border:#2a2f3a;
    --text:#e9ecf1; --muted:#8b93a3; --accent:#3ddc84; --accent2:#4da3ff;
    --warn:#ffb84d; --danger:#ff6b6b; --resto:#ffb84d;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    overscroll-behavior-y:none; height:100%;}
  body{display:flex; flex-direction:column; height:100dvh;}
  a{color:inherit;}
  button{font-family:inherit; cursor:pointer; border:none; -webkit-user-select:none; user-select:none;}
  .hidden{display:none !important;}

  /* ---------- Header ---------- */
  header{
    flex-shrink:0; background:var(--panel); border-bottom:1px solid var(--border);
    padding-top:calc(var(--safe-top) + 8px);
  }
  .trip-title{font-size:14px; font-weight:700; text-align:center; padding:0 12px 8px; color:var(--muted); letter-spacing:.3px;}
  .day-strip{display:flex; overflow-x:auto; gap:6px; padding:0 10px 10px; scroll-behavior:smooth; -webkit-overflow-scrolling:touch;}
  .day-strip::-webkit-scrollbar{display:none;}
  .day-chip{
    flex-shrink:0; min-width:52px; padding:6px 8px; border-radius:12px; background:var(--panel2);
    border:1px solid var(--border); text-align:center; font-size:11px; color:var(--muted);
  }
  .day-chip .dnum{font-size:15px; font-weight:800; color:var(--text); display:block;}
  .day-chip.active{background:var(--accent); border-color:var(--accent); color:#08130d;}
  .day-chip.active .dnum{color:#08130d;}
  .day-chip.today-marker{box-shadow:0 0 0 2px var(--accent2) inset;}

  .day-nav{display:flex; align-items:center; justify-content:space-between; padding:0 10px 10px; gap:8px;}
  .day-nav button{
    background:var(--panel2); border:1px solid var(--border); color:var(--text);
    border-radius:10px; padding:8px 14px; font-size:16px; flex-shrink:0;
  }
  .day-nav .day-label{flex:1; text-align:center;}
  .day-nav .day-label .big{font-size:16px; font-weight:800;}
  .day-nav .day-label .sub{font-size:12px; color:var(--muted);}

  /* ---------- Main scroll area ---------- */
  main{flex:1; overflow-y:auto; padding:12px 12px calc(90px + var(--safe-bottom));  -webkit-overflow-scrolling:touch;}

  .card{background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:14px; margin-bottom:12px;}
  .card h3{margin:0 0 10px; font-size:13px; text-transform:uppercase; letter-spacing:.5px; color:var(--muted); display:flex; align-items:center; gap:6px;}
  .card.hero{background:linear-gradient(160deg, #1c2b22, var(--panel)); border-color:#2c4a37;}
  .card.hero.ferry{background:linear-gradient(160deg, #17242f, var(--panel)); border-color:#294356;}

  .big-btn{
    display:flex; align-items:center; justify-content:center; gap:8px;
    width:100%; padding:15px; border-radius:12px; font-size:16px; font-weight:700; text-decoration:none;
    background:var(--accent); color:#08130d; margin-bottom:8px;
  }
  .big-btn.blue{background:var(--accent2); color:#081522;}
  .big-btn.ghost{background:var(--panel2); color:var(--text); border:1px solid var(--border);}
  .btn-row{display:flex; gap:8px;}
  .btn-row .big-btn{margin-bottom:0;}

  .info-line{display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-bottom:1px solid var(--border); gap:10px;}
  .info-line:last-child{border-bottom:none;}
  .info-line .label{font-size:12px; color:var(--muted);}
  .info-line .value{font-size:15px; font-weight:600; text-align:right;}
  .copy-btn{background:var(--panel2); border:1px solid var(--border); color:var(--text); border-radius:8px; padding:5px 10px; font-size:12px; flex-shrink:0;}
  .copy-btn.copied{background:var(--accent); color:#08130d; border-color:var(--accent);}

  .lang-toggle{display:flex; gap:6px; margin-bottom:12px;}
  .lang-toggle button{flex:1; padding:9px; border-radius:9px; background:var(--panel2); border:1px solid var(--border); color:var(--muted); font-size:13px; font-weight:700;}
  .lang-toggle button.active{background:var(--accent2); color:#081522; border-color:var(--accent2);}

  .item-card{background:var(--panel2); border:1px solid var(--border); border-radius:12px; padding:12px; margin-bottom:10px;}
  .item-card.done{opacity:.45;}
  .item-top{display:flex; justify-content:space-between; align-items:flex-start; gap:8px;}
  .item-name{font-size:15px; font-weight:700;}
  .item-name.strike{text-decoration:line-through;}
  .item-badges{display:flex; gap:5px; flex-wrap:wrap; margin:5px 0;}
  .pill{font-size:10px; padding:3px 7px; border-radius:20px; font-weight:700; white-space:nowrap;}
  .pill.dur-s{background:#1f3a2a; color:#5fe08a;}
  .pill.dur-m{background:#3a2f1a; color:#ffcb70;}
  .pill.dur-l{background:#3a1a1a; color:#ff8f8f;}
  .pill.indoor{background:#1a2c3a; color:#7fc3ff;}
  .pill.outdoor{background:#233a1a; color:#a9e07f;}
  .pill.resto{background:#3a2a12; color:var(--resto);}
  .item-desc{font-size:12.5px; color:var(--muted); margin:6px 0; line-height:1.4;}
  .item-actions{display:flex; gap:6px; margin-top:8px; flex-wrap:wrap;}
  .item-actions button, .item-actions a{
    font-size:12.5px; padding:7px 11px; border-radius:8px; background:var(--panel); border:1px solid var(--border); color:var(--text);
    text-decoration:none; display:inline-flex; align-items:center; gap:4px;
  }
  .check-btn{background:var(--panel) !important;}
  .check-btn.on{background:var(--accent) !important; color:#08130d !important; border-color:var(--accent) !important;}

  .nearby-wrap{margin-top:8px; padding-top:8px; border-top:1px dashed var(--border);}
  .nearby-head{font-size:11px; color:var(--resto); font-weight:700; margin-bottom:6px;}
  .nearby-item{background:var(--panel); border-radius:9px; padding:8px 10px; margin-bottom:6px; font-size:13px;}
  .nearby-item .n-name{font-weight:700;}
  .nearby-item .n-desc{color:var(--muted); font-size:11.5px; margin-top:3px; line-height:1.35;}
  .nearby-item a{color:var(--accent2); font-size:11.5px;}

  .empty-note{font-size:13px; color:var(--muted); text-align:center; padding:14px;}
  .section-toggle{display:flex; gap:8px; margin-bottom:10px;}
  .section-toggle button{flex:1; padding:8px; border-radius:9px; background:var(--panel2); border:1px solid var(--border); color:var(--muted); font-size:12.5px; font-weight:700;}
  .section-toggle button.active{background:var(--panel); color:var(--text); border-color:var(--accent2);}

  /* Planning / timeline */
  .step-block{background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:14px; margin-bottom:10px;}
  .step-block.current{border-color:var(--accent);}
  .step-block .st-top{display:flex; justify-content:space-between; align-items:center;}
  .step-block .st-name{font-weight:800; font-size:15px;}
  .step-block .st-dates{font-size:12px; color:var(--muted);}
  .step-block .st-meta{font-size:12.5px; color:var(--muted); margin-top:6px;}
  .step-block .st-days{display:flex; gap:5px; margin-top:8px; flex-wrap:wrap;}
  .step-block .st-days span{
    font-size:11px; padding:4px 8px; border-radius:8px; background:var(--panel2); border:1px solid var(--border); color:var(--muted);
  }
  .step-block .st-days span.today{background:var(--accent); color:#08130d; border-color:var(--accent); font-weight:800;}

  /* Restos tab filter */
  .resto-filter{display:flex; gap:6px; overflow-x:auto; padding-bottom:10px; margin-bottom:8px;}
  .resto-filter button{flex-shrink:0; padding:7px 12px; border-radius:20px; background:var(--panel2); border:1px solid var(--border); color:var(--muted); font-size:12.5px;}
  .resto-filter button.active{background:var(--resto); color:#2a1c05; border-color:var(--resto); font-weight:700;}

  /* Modal (reception mode) */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(0,0,0,.6); display:flex; align-items:flex-end; z-index:50;
  }
  .modal-overlay.hidden{display:none;}
  .modal-sheet{
    background:var(--panel); border-radius:20px 20px 0 0; padding:18px 18px calc(18px + var(--safe-bottom)); width:100%; max-height:88vh; overflow-y:auto;
  }
  .modal-sheet .m-close{width:36px; height:4px; background:var(--border); border-radius:3px; margin:0 auto 14px; }
  .modal-sheet h2{margin:0 0 4px; font-size:19px;}
  .modal-sheet .m-sub{font-size:12.5px; color:var(--muted); margin-bottom:14px;}

  /* Bottom tab bar */
  nav.tabbar{
    position:fixed; left:0; right:0; bottom:0; z-index:40;
    display:flex; background:var(--panel); border-top:1px solid var(--border);
    padding-bottom:var(--safe-bottom);
  }
  nav.tabbar button{
    flex:1; background:none; padding:10px 4px 8px; display:flex; flex-direction:column; align-items:center; gap:3px;
    color:var(--muted); font-size:10.5px; font-weight:700;
  }
  nav.tabbar button .ic{font-size:20px;}
  nav.tabbar button.active{color:var(--accent);}

  /* ---------- Refonte v2 ---------- */
  .big-title{font-size:19px; font-weight:800; line-height:1.25; letter-spacing:-.2px;}
  .card.hero.plan{background:linear-gradient(160deg,#2a2438,var(--panel)); border-color:#453a63;}
  .plan-sub{font-size:13px; color:var(--muted); margin-top:4px;}
  .tap-hint{font-size:11px; color:var(--muted); margin-top:10px; opacity:.8;}
  .tappable{cursor:pointer;}
  .tappable:active{transform:scale(.995);}

  .pill.booked{background:#3b2340; color:#e59bff;}
  .pill.booked.strict{background:#4a1f2a; color:#ff9db1;}
  .pill.time{background:#1a2c3a; color:#7fc3ff;}
  .pill.group{background:#2b3320; color:#c3e07f;}

  /* Zones (jour de trajet) */
  .zone{border:1px solid var(--border); border-radius:14px; padding:12px; margin-bottom:12px; background:rgba(255,255,255,.015);}
  .zone.road{border-color:#3a4254;}
  .zone.dest{border-color:#2c4a37;}
  .zone.plan-auto{border-color:#453a63;}
  .zone-head{font-size:12px; text-transform:uppercase; letter-spacing:.6px; font-weight:800; color:var(--muted); margin-bottom:10px;}
  .zone-sub{font-size:11.5px; font-weight:700; color:var(--resto); margin:12px 0 7px;}
  .zone .card{margin-bottom:8px;}

  /* Camp de base */
  .card.camp{background:linear-gradient(160deg,#1c2b22,var(--panel)); border-color:#2c4a37;}
  .card.camp.compact{padding:12px;}
  .camp-name{font-size:17px; font-weight:800;}
  .link-btn{background:none; border:none; color:var(--accent2); font-size:12.5px; padding:10px 0 0; text-decoration:underline;}

  /* Tuile compacte */
  .tile{display:flex; gap:10px; align-items:flex-start; background:var(--panel2); border:1px solid var(--border);
        border-radius:12px; padding:11px 12px; margin-bottom:8px;}
  .tile.done{opacity:.42;}
  .tile-main{flex:1; min-width:0;}
  .tile-name{font-size:15px; font-weight:700; line-height:1.3;}
  .tile-name.strike{text-decoration:line-through;}
  .tile .item-badges{margin:6px 0 0;}
  .tile-note{font-size:11.5px; color:var(--muted); margin-top:6px; line-height:1.35;}
  .tile-side{display:flex; flex-direction:column; gap:6px; flex-shrink:0;}
  .ic-btn{width:36px; height:36px; border-radius:10px; background:var(--panel); border:1px solid var(--border);
          color:var(--text); display:flex; align-items:center; justify-content:center; font-size:15px; text-decoration:none;}
  .ic-btn.check.on{background:var(--accent); color:#08130d; border-color:var(--accent);}

  /* Timeline */
  .timeline{margin-bottom:12px;}
  .tl-row{display:flex; gap:10px; align-items:stretch;}
  .tl-time{width:44px; flex-shrink:0; font-size:12.5px; font-weight:800; color:var(--muted); padding-top:2px; text-align:right;}
  .tl-line{width:14px; flex-shrink:0; position:relative;}
  .tl-line::before{content:""; position:absolute; left:6px; top:0; bottom:0; width:2px; background:var(--border);}
  .tl-row:first-child .tl-line::before{top:8px;}
  .tl-row:last-child .tl-line::before{bottom:calc(100% - 10px);}
  .dot{position:absolute; left:1px; top:4px; width:12px; height:12px; border-radius:50%;
       background:var(--panel2); border:2px solid var(--muted);}
  .dot.booked{background:#e59bff; border-color:#e59bff;}
  .dot.meal{background:var(--resto); border-color:var(--resto);}
  .tl-body{flex:1; min-width:0; padding-bottom:12px;}
  .tl-plain{padding:1px 0 0;}
  .tl-label{font-size:14px; font-weight:700;}
  .tl-note{font-size:11.5px; color:var(--muted); margin-top:3px; line-height:1.35;}
  .tl-options{margin-top:8px; padding:9px 10px; border:1px dashed var(--border); border-radius:11px;}
  .opt-head{font-size:11px; font-weight:700; color:var(--resto); margin-bottom:7px;}
  .tl-options .tile{margin-bottom:6px;}
  .tl-options .tile:last-child{margin-bottom:0;}

  /* Feuille de détail */
  .detail-desc{font-size:14px; color:#c6ccd8; line-height:1.5; margin:12px 0;}
  .sheet-sec{margin-top:14px;}
  .sheet-sec h3{margin:0 0 8px; font-size:12px; text-transform:uppercase; letter-spacing:.5px; color:var(--muted);}
  .mini-row{display:flex; justify-content:space-between; align-items:center; gap:10px; background:var(--panel2);
            border:1px solid var(--border); border-radius:11px; padding:10px 12px; margin-bottom:7px;}
  .mini-name{font-size:14px; font-weight:700;}
  .mini-desc{font-size:11.5px; color:var(--muted); margin-top:3px; line-height:1.35;}
  .mini-badges{margin-top:5px; display:flex; gap:5px; flex-wrap:wrap;}
  .chev{color:var(--muted); font-size:20px; flex-shrink:0;}
  .card.booking-card{background:linear-gradient(160deg,#2c1f33,var(--panel2)); border-color:#4a3358;}
  .big-btn.done-on{background:var(--accent); color:#08130d;}

  .swipe-area{touch-action:pan-y;}
</style>
</head>
<body>

<header>
  <div class="trip-title" id="tripTitle">Irlande — Août 2026</div>
  <div class="day-strip" id="dayStrip"></div>
  <div class="day-nav">
    <button id="prevDay">‹</button>
    <div class="day-label">
      <div class="big" id="dayBig">—</div>
      <div class="sub" id="daySub">—</div>
    </div>
    <button id="nextDay">›</button>
  </div>
</header>

<main id="view" class="swipe-area"></main>

<nav class="tabbar">
  <button data-tab="today" class="active"><span class="ic">📍</span>Aujourd'hui</button>
  <button data-tab="planning"><span class="ic">🗺️</span>Planning</button>
  <button data-tab="restos"><span class="ic">🍽️</span>Restos</button>
</nav>

<div class="modal-overlay hidden" id="modalOverlay">
  <div class="modal-sheet" id="modalSheet"></div>
</div>

const LS_DONE = "carnetDoneItems_v2";
const LS_DAY  = "carnetLastDay_v2";
const LS_LANG = "carnetLang_v2";

let lang = localStorage.getItem(LS_LANG) || "fr";

function esc(s){ return (s||"").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

// =====================================================================
// Jours
// =====================================================================
function parseDate(s){ const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); }
function isoLocal(d){
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,"0"), day=String(d.getDate()).padStart(2,"0");
  return y+"-"+m+"-"+day;
}
const WEEKDAYS = ["dim.","lun.","mar.","mer.","jeu.","ven.","sam."];
const MONTHS = ["jan.","fév.","mars","avr.","mai","juin","juil.","août","sept.","oct.","nov.","déc."];
function fmtDayLabel(d){ return WEEKDAYS[d.getDay()]+" "+d.getDate()+" "+MONTHS[d.getMonth()]; }

function buildDays(){
  const steps = TRIP.steps;
  if(!steps.length) return [];
  const first = parseDate(steps[0].arrival);
  const last = parseDate(steps[steps.length-1].departure);
  const days = [];
  for(let d = new Date(first); d <= last; d.setDate(d.getDate()+1)){
    const iso = isoLocal(d);
    let step = steps.find(s => iso >= s.arrival && iso < s.departure);
    if(!step) step = steps[steps.length-1];
    const idx = steps.indexOf(step);
    const isArrival = iso === step.arrival;
    const prevStep = idx > 0 ? steps[idx-1] : null;
    const isTravelDay = isArrival && prevStep !== null;
    days.push({ date:new Date(d), iso, step, isArrival, isTravelDay, prevStep: isTravelDay ? prevStep : null });
  }
  return days;
}
const DAYS = buildDays();

function todayIndex(){
  const now = isoLocal(new Date());
  let idx = DAYS.findIndex(d => d.iso === now);
  if(idx === -1) idx = (DAYS.length && now < DAYS[0].iso) ? 0 : DAYS.length - 1;
  return idx;
}
let dayIdx = (() => {
  const saved = localStorage.getItem(LS_DAY);
  if(saved !== null){ const n = Number(saved); if(n >= 0 && n < DAYS.length) return n; }
  return todayIndex();
})();

// Helpers données
// =====================================================================
function stepById(id){ return TRIP.steps.find(s=>s.id===id); }
function itemById(id){ return TRIP.items.find(i=>i.id===id); }
function itemsForStep(stepId){ return TRIP.items.filter(i=>i.link && i.link.kind==="step" && i.link.stepId===stepId); }
function itemsForTransit(a,b){ return TRIP.items.filter(i=>i.link && i.link.kind==="transit" && i.link.fromStepId===a && i.link.toStepId===b); }
function childrenOf(id, type){ return TRIP.items.filter(i=>i.link && i.link.kind==="activite" && i.link.itemId===id && (!type || i.type===type)); }
function restosNearActivity(id){ return childrenOf(id, "resto"); }
function subStops(id){ return childrenOf(id, "activite"); }
function isFerryStep(step){ return !step.hotel; }
function planForDay(iso){ return (TRIP.plans||[]).find(p=>p.date===iso); }
function bookingsOn(iso){
  return TRIP.items.filter(i=>i.booking && i.booking.date===iso)
    .sort((a,b)=> (a.booking.time||"99:99").localeCompare(b.booking.time||"99:99"));
}
function shortName(name){ return (name||"").split(" (")[0].split(" -")[0].split(" –")[0]; }
function stepEndpoint(step, role){
  if(step.ferry) return shortName(role==="from" ? step.ferry.to : step.ferry.from) + " (ferry)";
  return shortName(step.name);
}

// =====================================================================
// Badges
// =====================================================================
function durPill(min){
  if(!min) return "";
  let cls="dur-s", label=min+" min";
  if(min > 300){ cls="dur-l"; label="Journée entière"; }
  else if(min > 150){ cls="dur-l"; label="~"+Math.round(min/60)+"h"; }
  else if(min > 60){ cls="dur-m"; label="~"+(Math.round(min/60*10)/10)+"h"; }
  return '<span class="pill '+cls+'">⏱ '+label+'</span>';
}
function indoorPill(item){
  if(item.type !== "activite" || item.indoor === undefined) return "";
  return item.indoor ? '<span class="pill indoor">🏠 abri possible</span>'
                     : '<span class="pill outdoor">🌦️ plein air</span>';
}
function bookedPill(item){
  const b = item.booking; if(!b) return "";
  const cls = b.strict ? "booked strict" : "booked";
  return '<span class="pill '+cls+'">🎟️ Réservé'+(b.time ? " "+b.time : "")+'</span>';
}
function groupPill(item){
  const n = subStops(item.id).length;
  return n ? '<span class="pill group">🧭 '+n+' arrêts</span>' : "";
}
function fmtISOHuman(iso){
  const d = parseDate(iso);
  return WEEKDAYS[d.getDay()]+" "+d.getDate()+" "+MONTHS[d.getMonth()];
}
function nightsPill(step){
  const n = Math.round((parseDate(step.departure) - parseDate(step.arrival)) / 86400000);
  return '<span class="pill time">🛏️ '+n+' nuit'+(n>1?"s":"")+' · jusqu\'au '+esc(fmtISOHuman(step.departure))+'</span>';
}
function timePill(txt, icon){ return '<span class="pill time">'+(icon||"🕒")+' '+esc(txt)+'</span>'; }
function badgesFor(item){
  return bookedPill(item) + (item.type==="activite" ? durPill(item.duration) : '<span class="pill resto">Restaurant</span>')
       + groupPill(item) + indoorPill(item);
}

// =====================================================================
// Header
// =====================================================================
function renderHeader(){
  document.getElementById("tripTitle").textContent = TRIP.name || "Mon voyage";
  const strip = document.getElementById("dayStrip");
  const now = isoLocal(new Date());
  strip.innerHTML = DAYS.map((d,i) => {
    const cls = ["day-chip"];
    if(i===dayIdx) cls.push("active");
    if(d.iso===now) cls.push("today-marker");
    return '<button class="'+cls.join(" ")+'" data-day="'+i+'"><span class="dnum">'+d.date.getDate()+'</span>J'+(i+1)+'</button>';
  }).join("");
  const cur = DAYS[dayIdx];
  const plan = cur ? planForDay(cur.iso) : null;
  document.getElementById("dayBig").textContent = cur ? "Jour "+(dayIdx+1)+" — "+fmtDayLabel(cur.date) : "—";
  document.getElementById("daySub").textContent = cur ? (plan ? plan.title : cur.step.name) : "—";
  document.getElementById("prevDay").style.opacity = dayIdx<=0 ? .3 : 1;
  document.getElementById("nextDay").style.opacity = dayIdx>=DAYS.length-1 ? .3 : 1;
  const activeChip = strip.querySelector(".day-chip.active");
  if(activeChip) activeChip.scrollIntoView({inline:"center", block:"nearest"});
}

function hideSheet(){ sheetOpen = false; overlayEl().classList.add("hidden"); }
function closeSheet(){ if(sheetOpen) history.back(); else hideSheet(); }
document.getElementById("modalOverlay").addEventListener("click", e => { if(e.target.id==="modalOverlay") closeSheet(); });

function copyToClipboard(text, btn){
  const done = () => {
    btn.textContent = L[lang].copied; btn.classList.add("copied");
    setTimeout(()=>{ btn.textContent = L[lang].copy; btn.classList.remove("copied"); }, 1600);
  };
  if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done).catch(done);
  else { const ta=document.createElement("textarea"); ta.value=text; document.body.appendChild(ta); ta.select();
         try{document.execCommand("copy");}catch(e){} document.body.removeChild(ta); done(); }
}
function langToggleHTML(){
  return '<div class="lang-toggle">'
    + '<button data-lang="fr" class="'+(lang==="fr"?"active":"")+'">🇫🇷 Français</button>'
    + '<button data-lang="en" class="'+(lang==="en"?"active":"")+'">🇬🇧 English</button></div>';
}
function bindLang(rerender){
  sheetEl().querySelectorAll("[data-lang]").forEach(b => b.addEventListener("click", () => {
    lang = b.dataset.lang; localStorage.setItem(LS_LANG, lang); rerender();
  }));
}
function line(label, value){
  if(!value) return "";
  return '<div class="info-line"><span class="label">'+esc(label)+'</span><span class="value">'+esc(value)+'</span></div>';
}

// ---- détail d'une activité / d'un resto -----------------------------
function detailItem(id){
  const it = itemById(id); if(!it) return;
  const b = it.booking;
  const stops = subStops(id);
  const restos = restosNearActivity(id);
  const isDone = doneItems.has(id);
  showSheet(
    '<h2>'+(it.type==="resto"?"🍽️ ":"📍 ")+esc(it.name)+'</h2>'
    + '<div class="item-badges" style="margin-bottom:12px;">'+badgesFor(it)+'</div>'
    + (b ? '<div class="card booking-card" style="margin:0 0 12px;">'
        + '<h3>🎟️ Réservation confirmée</h3>'
        + line(L[lang].ref, b.ref)
        + line(L[lang].slot, b.time ? (b.date + " · " + b.time + (b.endTime ? "–"+b.endTime : "")) : b.date)
        + (b.arriveBy ? line("Être sur place à", b.arriveBy) : "")
        + line(L[lang].party, b.party)
        + line(L[lang].price, b.price)
        + line(L[lang].provider, b.provider)
        + (b.notes ? '<div class="item-desc" style="margin-top:8px;">'+esc(b.notes)+'</div>' : "")
        + '<button class="big-btn ghost" style="margin-top:10px;" id="copyRef">'+L[lang].copy+' n° '+esc(b.ref)+'</button>'
      + '</div>' : "")
    + (it.description ? '<div class="detail-desc">'+esc(it.description)+'</div>' : "")
    + (stops.length ? '<div class="sheet-sec"><h3>🧭 Les arrêts de la boucle</h3>'
        + stops.map(s => '<div class="mini-row" data-detail="'+s.id+'"><div><div class="mini-name">'+esc(s.name)+'</div>'
            + '<div class="mini-badges">'+durPill(s.duration)+indoorPill(s)+'</div></div><span class="chev">›</span></div>').join("")
      + '</div>' : "")
    + (restos.length ? '<div class="sheet-sec"><h3>🍽️ Où manger sur place</h3>'
        + restos.map(r => '<div class="mini-row" data-detail="'+r.id+'"><div><div class="mini-name">'+esc(r.name)+'</div>'
            + (r.description ? '<div class="mini-desc">'+esc(r.description)+'</div>' : "")
          + '</div><span class="chev">›</span></div>').join("")
      + '</div>' : "")
    + '<div class="btn-row" style="margin-top:14px;">'
      + (it.routeMapsLink ? '<a class="big-btn" href="'+esc(it.routeMapsLink)+'" target="_blank" rel="noopener">🗺️ Itinéraire</a>'
         : (it.mapsLink ? '<a class="big-btn" href="'+esc(it.mapsLink)+'" target="_blank" rel="noopener">📍 Y aller</a>' : ""))
      + '<button class="big-btn ghost'+(isDone?" done-on":"")+'" data-toggle-done="'+id+'">'+(isDone?"✓ Fait":"Marquer fait")+'</button>'
    + '</div>'
  );
  const c = document.getElementById("copyRef");
  if(c) c.addEventListener("click", e => copyToClipboard(b.ref, e.target));
  sheetEl().querySelectorAll("[data-detail]").forEach(el => el.addEventListener("click", () => detailItem(el.dataset.detail)));
  sheetEl().querySelectorAll("[data-toggle-done]").forEach(el => el.addEventListener("click", () => {
    if(doneItems.has(id)) doneItems.delete(id); else doneItems.add(id);
    saveDone(); renderView(); detailItem(id);
  }));
}

// =====================================================================
// Cartes compactes
// =====================================================================
function card(item, opts){
  opts = opts || {};
  const isDone = doneItems.has(item.id);
  return '<div class="tile'+(isDone?" done":"")+'" data-detail="'+item.id+'">'
    + '<div class="tile-main">'
      + '<div class="tile-name'+(isDone?" strike":"")+'">'+(item.type==="resto"?"🍽️ ":"📍 ")+esc(item.name)+'</div>'
      + '<div class="item-badges">'+badgesFor(item)+'</div>'
      + (opts.note ? '<div class="tile-note">'+esc(opts.note)+'</div>' : "")
    + '</div>'
    + '<div class="tile-side">'
      + (item.mapsLink ? '<a class="ic-btn" href="'+esc(item.mapsLink)+'" target="_blank" rel="noopener" title="Maps">📍</a>' : "")
      + '<button class="ic-btn check'+(isDone?" on":"")+'" data-toggle-done="'+item.id+'">✓</button>'
    + '</div>'
  + '</div>';
}
function tileList(list, opts){
  return list.length ? list.map(i=>card(i, opts)).join("") : "";
}

}
function arrivalHotelCard(step){
  const h = step.hotel;
  return '<div class="card hero">'
    + '<h3>🏨 Objectif du soir</h3>'
    + '<div class="camp-name">'+esc(h.name)+'</div>'

function supermarketMapsLink(step){

}
function diningBlock(title, list, step){
  return '<div class="card"><h3>🍽️ '+esc(title)+'</h3>'
    + (list.length ? tileList(list) : '<div class="empty-note">Aucune adresse enregistrée ici.</div>')
    + (step ? '<a class="big-btn ghost" style="margin-top:4px;" href="'+esc(supermarketMapsLink(step))+'" target="_blank" rel="noopener">🛒 Supermarché à proximité</a>' : "")
  + '</div>';
}

// =====================================================================
// TAB Aujourd'hui — un rendu par type de journée
// =====================================================================
function renderToday(){
  const day = DAYS[dayIdx];
  if(!day) return '<div class="empty-note">Aucune étape définie.</div>';
  if(isFerryStep(day.step)) return renderFerryDay(day);
  if(day.isTravelDay)      return renderTransitDay(day);
  const plan = planForDay(day.iso);
  if(plan)                 return renderPlanDay(day, plan);
  return renderBaseDay(day);
}

// ---- Jour de ferry --------------------------------------------------
function renderFerryDay(day){
  const step = day.step, f = step.ferry;
  let html = "";
  if(day.isTravelDay) html += roadZone(day, "🛣️ Sur la route vers le port");
  if(!f) return html + '<div class="empty-note">Traversée — informations à compléter.</div>';

  const isDeparture = day.iso === f.departDate;
  html += '<div class="card hero ferry tappable" data-open-ferry="'+step.id+'">'
    + '<h3>⛴️ Ferry</h3>'
    + '<div class="big-title">'+esc(shortName(f.from))+' → '+esc(shortName(f.to))+'</div>'
    + '<div class="item-badges" style="margin:8px 0 2px;">'
      + (isDeparture
          ? timePill("Départ "+f.departTime, "🚢") + '<span class="pill booked strict">🎫 Enregistrement '+esc(f.checkInTime)+'</span>'
            + timePill("Arrivée "+f.arriveTime+" le lendemain", "⚓")
          : timePill("Arrivée "+f.arriveTime, "⚓") + '<span class="pill booked">🎫 Réf. '+esc(f.ref)+'</span>')
    + '</div>'
    + (isDeparture
        ? '<a class="big-btn" style="margin-top:10px;" href="'+esc(f.mapsLink)+'" target="_blank" rel="noopener">📍 '+esc(f.mapsLabel||"Aller au terminal")+'</a>'
        : "")
    + '<div class="tap-hint">Touche la carte → réf., cabine, passagers, véhicule</div>'
  + '</div>';
  return html;
}

// ---- Jour de trajet -------------------------------------------------
function roadZone(day, title){
  const from = day.prevStep, step = day.step;
  const transit = itemsForTransit(from.id, step.id);
  const booked  = bookingsOn(day.iso).filter(i => !transit.some(t=>t.id===i.id));
  const acts    = transit.filter(i=>i.type==="activite").concat(booked);
  const restos  = transit.filter(i=>i.type==="resto")
                  .concat(acts.flatMap(a => restosNearActivity(a.id)));
  let html = '<div class="zone road"><div class="zone-head">'+title+'</div>';
  html += acts.length ? tileList(acts) : '<div class="empty-note">Rien de prévu en chemin — roule tranquille.</div>';
  if(restos.length){
    html += '<div class="zone-sub">🍽️ Manger en chemin</div>' + tileList(restos);
  }
  html += '</div>';
  return html;
}
function renderTransitDay(day){
  const from = day.prevStep, step = day.step;
  let html = '<div class="card hero">'
    + '<h3>🚗 Jour de route</h3>'
    + '<div class="big-title">'+esc(stepEndpoint(from,"from"))+' → '+esc(stepEndpoint(step,"to"))+'</div>'
  + '</div>';
  html += roadZone(day, "🛣️ Sur la route");
  // Zone destination
  html += '<div class="zone dest"><div class="zone-head">🎯 À destination</div>';
  html += arrivalHotelCard(step);
  const restos = itemsForStep(step.id).filter(i=>i.type==="resto");
  html += '<div class="zone-sub">🍽️ Dîner sur place</div>';
  html += restos.length ? tileList(restos) : '<div class="empty-note">Aucune adresse enregistrée ici.</div>';
  html += '<a class="big-btn ghost" style="margin-top:6px;" href="'+esc(supermarketMapsLink(step))+'" target="_blank" rel="noopener">🛒 Supermarché à proximité</a>';
  html += '</div>';
  return html;
}

// ---- Journée planifiée ----------------------------------------------
function renderPlanDay(day, plan){
  const step = day.step;
  let html = '<div class="card hero plan">'
    + '<h3>🗺️ Programme de la journée</h3>'
    + '<div class="big-title">'+esc(plan.title)+'</div>'
    + (plan.subtitle ? '<div class="plan-sub">'+esc(plan.subtitle)+'</div>' : "")
    + (plan.distance ? '<div class="item-badges" style="margin-top:8px;"><span class="pill dur-m">🚗 '+esc(plan.distance)+'</span></div>' : "")
    + (plan.routeMapsLink ? '<a class="big-btn" style="margin-top:10px;" href="'+esc(plan.routeMapsLink)+'" target="_blank" rel="noopener">🗺️ Voir la boucle sur Maps</a>' : "")
  + '</div>';

  html += '<div class="timeline">';
  plan.entries.forEach(e => {
    const it = e.itemId ? itemById(e.itemId) : null;
    const dotCls = it && it.booking ? "dot booked" : (e.kind==="repas" ? "dot meal" : "dot");
    html += '<div class="tl-row">'
      + '<div class="tl-time">'+esc(e.time||"")+'</div>'
      + '<div class="tl-line"><span class="'+dotCls+'"></span></div>'
      + '<div class="tl-body">';
    if(it){
      html += card(it, {note:e.note});
    } else {
      html += '<div class="tl-plain">'
        + '<div class="tl-label">'+esc(e.label||"")+'</div>'
        + (e.note ? '<div class="tl-note">'+esc(e.note)+'</div>' : "")
      + '</div>';
      if(e.kind==="repas" && e.options && e.options.length){
        html += '<div class="tl-options">'
          + '<div class="opt-head">'+e.options.length+' proposition'+(e.options.length>1?"s":"")+' — au choix</div>'
          + tileList(e.options.map(itemById).filter(Boolean))
        + '</div>';
      }
    }
    html += '</div></div>';
  });
  html += '</div>';

  html += baseCampCard(step, true);
  const dinner = (plan.dinnerOptions||[]).map(itemById).filter(Boolean);
  if(dinner.length) html += diningBlock("Où dîner ce soir", dinner, step);
  return html;
}

// ---- Jour au camp de base -------------------------------------------
function renderBaseDay(day){
  const step = day.step;
  let html = baseCampCard(step, false);

  const booked = bookingsOn(day.iso);
  if(booked.length){
    html += '<div class="zone plan-auto"><div class="zone-head">🎟️ Réservé aujourd\'hui</div>'
      + tileList(booked) + '</div>';
  }

  const acts = itemsForStep(step.id).filter(i => i.type==="activite"
    && !booked.some(b=>b.id===i.id)
    && !(i.booking && i.booking.date !== day.iso));
  if(acts.length){
    const filtered = indoorFilter === "indoor" ? acts.filter(a=>a.indoor) : acts;
    html += '<div class="card"><h3>🎯 Propositions de journée</h3>'
      + '<div class="section-toggle">'
        + '<button data-indoor-filter="all" class="'+(indoorFilter==="all"?"active":"")+'">Toutes ('+acts.length+')</button>'
        + '<button data-indoor-filter="indoor" class="'+(indoorFilter==="indoor"?"active":"")+'">🌧️ Si mauvais temps ('+acts.filter(a=>a.indoor).length+')</button>'
      + '</div>'
      + (filtered.length ? tileList(filtered) : '<div class="empty-note">Rien avec option abri ici — regarde la météo avant de partir.</div>')
      + '<div class="tap-hint">Touche une carte pour le détail, les arrêts et où manger sur place</div>'
    + '</div>';
  }

  const restos = itemsForStep(step.id).filter(i=>i.type==="resto");
  html += diningBlock("Où manger ce soir", restos, step);
  return html;
}

// =====================================================================
// TAB Planning
// =====================================================================
function renderPlanning(){
  const now = isoLocal(new Date());
  let html = '<div class="empty-note" style="text-align:left; padding:2px 2px 12px;">Vue d\'ensemble — touche une étape ou un jour pour t\'y rendre.</div>';
  TRIP.steps.forEach(step => {
    const stepDays = DAYS.map((d,i)=>({d:d,i:i})).filter(x=>x.d.step.id===step.id);
    const isCurrent = stepDays.some(x=>x.i===dayIdx);
    html += '<div class="step-block '+(isCurrent?"current":"")+'" data-jump-step="'+step.id+'">'
      + '<div class="st-top"><div class="st-name">'+(isFerryStep(step)?"⛴️ ":"🏨 ")+esc(shortName(step.name))+'</div>'
      + '<div class="st-dates">'+esc(step.arrival)+' → '+esc(step.departure)+'</div></div>'
      + (step.hotel ? '<div class="st-meta">'+esc(step.hotel.name)+' · '+esc(step.hotel.price)+'</div>' : "")
      + '<div class="st-days">'
      + stepDays.map(x => {
          const p = planForDay(x.d.iso);
          const b = bookingsOn(x.d.iso).length;
          const cls = (x.d.iso===now || x.i===dayIdx) ? "today" : "";
          return '<span class="'+cls+'" data-day="'+x.i+'">J'+(x.i+1)+' · '+x.d.date.getDate()+(p?" 🗺️":(b?" 🎟️":""))+'</span>';
        }).join("")
      + '</div></div>';
  });
  return html;
}

// =====================================================================
// TAB Restos
// =====================================================================
function linkedToStep(item, stepId){
  if(!item.link) return false;
  if(item.link.kind==="step") return item.link.stepId===stepId;
  if(item.link.kind==="transit") return item.link.fromStepId===stepId || item.link.toStepId===stepId;
  if(item.link.kind==="activite"){ const a = itemById(item.link.itemId); return a && linkedToStep(a, stepId); }
  return false;
}
function renderRestos(){
  const restos = TRIP.items.filter(i=>i.type==="resto");
  let html = '<div class="resto-filter">'
    + '<button data-resto-filter="all" class="'+(restoFilterStepId==="all"?"active":"")+'">Tous ('+restos.length+')</button>'
    + TRIP.steps.map(s => {
        const c = restos.filter(r=>linkedToStep(r,s.id)).length;
        return c ? '<button data-resto-filter="'+s.id+'" class="'+(restoFilterStepId===s.id?"active":"")+'">'+esc(shortName(s.name))+' ('+c+')</button>' : "";
      }).join("")
  + '</div>';
  const list = restoFilterStepId==="all" ? restos : restos.filter(r=>linkedToStep(r, restoFilterStepId));
  html += list.length ? tileList(list) : '<div class="empty-note">Aucun resto pour ce filtre.</div>';
  return html;
}

// =====================================================================
// Render + events
// =====================================================================
function renderView(){
  const view = document.getElementById("view");
  if(currentTab === "today") view.innerHTML = renderToday();
  else if(currentTab === "planning") view.innerHTML = renderPlanning();
  else view.innerHTML = renderRestos();
  bindViewEvents(view);
  renderHeader();
  localStorage.setItem(LS_DAY, String(dayIdx));
}

function bindViewEvents(view){
  view.querySelectorAll("[data-toggle-done]").forEach(btn => btn.addEventListener("click", e => {
    e.stopPropagation();
    const id = btn.dataset.toggleDone;
    if(doneItems.has(id)) doneItems.delete(id); else doneItems.add(id);
    saveDone(); renderView();
  }));
  view.querySelectorAll("[data-detail]").forEach(el => el.addEventListener("click", e => {
    if(e.target.closest("a") || e.target.closest("button")) return;
    detailItem(el.dataset.detail);
  }));
  view.querySelectorAll("[data-open-hotel]").forEach(b => b.addEventListener("click", e => { e.stopPropagation(); detailHotel(b.dataset.openHotel); }));
  view.querySelectorAll("[data-open-ferry]").forEach(b => b.addEventListener("click", e => {
    if(e.target.closest("a")) return;
    detailFerry(b.dataset.openFerry);
  }));
  view.querySelectorAll("[data-indoor-filter]").forEach(b => b.addEventListener("click", e => { e.stopPropagation(); indoorFilter = b.dataset.indoorFilter; renderView(); }));
  view.querySelectorAll("[data-resto-filter]").forEach(b => b.addEventListener("click", e => { e.stopPropagation(); restoFilterStepId = b.dataset.restoFilter; renderView(); }));
  view.querySelectorAll("[data-jump-step]").forEach(b => b.addEventListener("click", e => {
    if(e.target.closest("[data-day]")) return;
    const idx = DAYS.findIndex(d=>d.step.id===b.dataset.jumpStep);
    if(idx>=0){ dayIdx = idx; goTab("today"); }
  }));
  view.querySelectorAll("[data-day]").forEach(b => b.addEventListener("click", e => {
    e.stopPropagation(); dayIdx = Number(b.dataset.day); goTab("today");
  }));
}

function syncTabs(){ document.querySelectorAll("nav.tabbar button").forEach(b => b.classList.toggle("active", b.dataset.tab===currentTab)); }
function goTab(tab, push){
  currentTab = tab; syncTabs(); renderView();
  document.getElementById("view").scrollTop = 0;
  if(push !== false) history.pushState({tab:tab, dayIdx:dayIdx}, "", "#"+tab);
}

document.querySelectorAll("nav.tabbar button").forEach(b => b.addEventListener("click", () => goTab(b.dataset.tab)));
document.getElementById("dayStrip").addEventListener("click", e => {
  const chip = e.target.closest("[data-day]");
  if(chip){ dayIdx = Number(chip.dataset.day); renderView(); }
});
document.getElementById("prevDay").addEventListener("click", () => { if(dayIdx>0){ dayIdx--; renderView(); } });
document.getElementById("nextDay").addEventListener("click", () => { if(dayIdx<DAYS.length-1){ dayIdx++; renderView(); } });

window.addEventListener("popstate", e => {
  const st = e.state || {};
  if(sheetOpen && !st.sheet){ hideSheet(); return; }
  if(st.tab){ currentTab = st.tab; if(typeof st.dayIdx === "number") dayIdx = st.dayIdx; }
  else currentTab = "today";
  syncTabs(); renderView();
});

// Swipe horizontal = changer de jour (onglet Aujourd'hui uniquement)
(function(){
  let sx=0, sy=0, tracking=false;
  const main = document.getElementById("view");
  main.addEventListener("touchstart", e => {
    if(currentTab!=="today" || sheetOpen) return;
    sx = e.touches[0].clientX; sy = e.touches[0].clientY; tracking = true;
  }, {passive:true});
  main.addEventListener("touchend", e => {
    if(!tracking) return; tracking = false;
    const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
    if(Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy)*1.5){
      if(dx < 0 && dayIdx < DAYS.length-1){ dayIdx++; renderView(); }
      else if(dx > 0 && dayIdx > 0){ dayIdx--; renderView(); }
    }
  }, {passive:true});
})();

// Init
history.replaceState({tab:"today", dayIdx:dayIdx}, "", "#today");
renderView();

if("serviceWorker" in navigator){
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(()=>{}));
}
</script>
</body>
</html>
