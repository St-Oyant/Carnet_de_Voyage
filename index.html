<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#0f1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Carnet Irlande">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Carnet de voyage — Irlande 2026</title>
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --panel2:#1e222b; --border:#2a2f3a;
    --text:#e9ecf1; --muted:#8b93a3; --accent:#3ddc84; --accent2:#4da3ff;
    --warn:#ffb84d; --danger:#ff6b6b; --resto:#ffb84d; --shop:#c78cff;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    overscroll-behavior-y:none; height:100%;}
  body{display:flex; flex-direction:column; height:100dvh;}
  a{color:inherit;}
  button{font-family:inherit; cursor:pointer; border:none; -webkit-user-select:none; user-select:none;}
  .hidden{display:none !important;}

  /* ---------- Frise de dates ---------- */
  header{flex-shrink:0; background:var(--panel); border-bottom:1px solid var(--border); padding-top:calc(var(--safe-top) + 8px);}
  .trip-title{font-size:13px; font-weight:700; text-align:center; padding:0 12px 8px; color:var(--muted); letter-spacing:.3px;}
  .day-strip{display:flex; overflow-x:auto; gap:6px; padding:0 10px 10px; scroll-behavior:smooth; -webkit-overflow-scrolling:touch;}
  .day-strip::-webkit-scrollbar{display:none;}
  .day-chip{flex-shrink:0; min-width:54px; padding:6px 8px; border-radius:12px; background:var(--panel2);
            border:1px solid var(--border); text-align:center; font-size:11px; color:var(--muted); position:relative;}
  .day-chip .dnum{font-size:15px; font-weight:800; color:var(--text); display:block; line-height:1.15;}
  .day-chip .dot{display:block; height:3px; border-radius:2px; margin-top:4px; background:var(--border);}
  .day-chip .dot.camp{background:var(--accent);} .day-chip .dot.transit{background:var(--accent2);}
  .day-chip .dot.ferry{background:#7fb0ff;} .day-chip .dot.multi{background:linear-gradient(90deg,var(--accent),var(--warn));}
  .day-chip.active{background:var(--accent); border-color:var(--accent); color:#08130d;}
  .day-chip.active .dnum{color:#08130d;} .day-chip.active .dot{background:rgba(8,19,13,.45);}
  .day-chip.today-marker{box-shadow:0 0 0 2px var(--accent2) inset;}

  .day-nav{display:flex; align-items:center; justify-content:space-between; padding:0 10px 10px; gap:8px;}
  .day-nav button{background:var(--panel2); border:1px solid var(--border); color:var(--text); border-radius:10px; padding:8px 14px; font-size:16px; flex-shrink:0;}
  .day-nav .day-label{flex:1; text-align:center; min-width:0;}
  .day-nav .day-label .big{font-size:16px; font-weight:800;}
  .day-nav .day-label .sub{font-size:12px; color:var(--muted);}

  main{flex:1; overflow-y:auto; padding:12px 12px calc(92px + var(--safe-bottom)); -webkit-overflow-scrolling:touch;}

  /* ---------- Blocs ---------- */
  .card{background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:14px; margin-bottom:12px;}
  .card.tight{padding:0; overflow:hidden;}
  .card h3{margin:0 0 10px; font-size:12px; text-transform:uppercase; letter-spacing:.6px; color:var(--muted); display:flex; align-items:center; gap:6px;}

  /* 1 — Entête de contexte */
  .ctx{border-radius:14px; padding:14px; margin-bottom:12px; border:1px solid #2c4a37;
       background:linear-gradient(160deg,#1c2b22,var(--panel));}
  .ctx.transit{border-color:#294356; background:linear-gradient(160deg,#17242f,var(--panel));}
  .ctx.ferry{border-color:#31406b; background:linear-gradient(160deg,#1a2038,var(--panel));}
  .ctx .kind{font-size:11px; text-transform:uppercase; letter-spacing:.9px; color:var(--muted); font-weight:700;}
  .ctx .name{font-size:21px; font-weight:800; margin-top:3px; line-height:1.2;}
  .ctx .name .arrow{color:var(--accent2); font-weight:600;}
  .ctx .meta{font-size:12.5px; color:var(--muted); margin-top:6px; display:flex; flex-wrap:wrap; gap:5px 12px;}

  /* 2 — Journée */
  .opts{display:flex; flex-direction:column; gap:9px;}
  .opt{display:block; width:100%; text-align:left; background:var(--panel2); border:1px solid var(--border);
       border-radius:12px; padding:12px; color:var(--text);}
  .opt .t{font-size:15.5px; font-weight:700;}
  .opt .s{font-size:12.5px; color:var(--muted); margin-top:3px;}
  .opt .m{font-size:11.5px; color:var(--muted); margin-top:7px; display:flex; flex-wrap:wrap; gap:5px;}
  .opt.sel{border-color:var(--accent); background:#16261d;}

  .jour-head{display:flex; align-items:flex-start; justify-content:space-between; gap:10px; margin-bottom:10px;}
  .jour-head .t{font-size:18px; font-weight:800; line-height:1.2;}
  .jour-head .s{font-size:12.5px; color:var(--muted); margin-top:3px;}
  .swapbtn{flex-shrink:0; background:var(--panel2); border:1px solid var(--border); color:var(--muted); border-radius:9px; padding:6px 10px; font-size:11.5px;}

  /* Carte maison : tuiles OSM + calque SVG */
  .map{position:relative; overflow:hidden; border-radius:12px; border:1px solid var(--border); background:#111726; touch-action:pan-y; user-select:none;}
  .map.jour{height:230px;} .map.small{height:132px;} .map.big{height:320px;}
  .map .tiles{position:absolute; inset:0;}
  .map .tiles img{position:absolute; width:256px; height:256px; border:0; display:block; filter:grayscale(.35) brightness(.7) contrast(1.08);}
  .map svg{position:absolute; inset:0; width:100%; height:100%; pointer-events:none;}
  .map svg .hit{pointer-events:auto; cursor:pointer;}
  .map .attr{position:absolute; right:5px; bottom:2px; font-size:9px; color:#6c7690; z-index:3;}
  .map .note{position:absolute; left:7px; bottom:6px; font-size:10.5px; color:var(--muted); background:rgba(15,20,32,.88);
             border:1px solid var(--border); border-radius:6px; padding:3px 7px; z-index:3;}
  .map .note.warn{color:var(--warn); border-color:#5c3d15;}
  .maproute{display:flex; align-items:center; justify-content:center; gap:7px; width:100%; margin-top:8px;
            background:var(--accent2); color:#081522; font-weight:700; font-size:14px; border-radius:11px; padding:12px; text-decoration:none;}
  .maphint{font-size:11px; color:var(--muted); text-align:center; margin-top:6px;}

  /* Timeline */
  .tl{margin-top:14px;}
  .tl-row{display:flex; gap:10px; align-items:stretch;}
  .tl-time{flex:0 0 46px; font-size:13px; font-weight:800; color:var(--accent); padding-top:1px; text-align:right;}
  .tl-time.soft{color:var(--muted); font-weight:600;}
  .tl-line{flex:0 0 12px; position:relative;}
  .tl-line::before{content:''; position:absolute; left:5px; top:0; bottom:0; width:2px; background:var(--border);}
  .tl-row:first-child .tl-line::before{top:8px;} .tl-row:last-child .tl-line::before{bottom:calc(100% - 10px);}
  .tl-line i{position:absolute; left:0; top:5px; width:12px; height:12px; border-radius:50%; background:var(--accent); border:2px solid var(--bg);}
  .tl-line i.repas{background:var(--resto);} .tl-line i.bout{background:var(--muted);} .tl-line i.act{background:var(--accent);}
  .tl-body{flex:1; min-width:0; padding-bottom:16px;}
  .tl-seg{font-size:11px; color:var(--muted); margin-bottom:3px; display:flex; align-items:center; gap:4px;}
  .tl-t{font-size:15.5px; font-weight:700; line-height:1.25;}
  .tl-n{font-size:12.5px; color:var(--muted); margin-top:3px; line-height:1.4;}
  .tl-body .badges{margin-top:6px;}

  .tl-opts{margin-top:8px; display:flex; flex-direction:column; gap:6px;}
  .tl-opt{display:flex; align-items:center; gap:8px; background:var(--panel2); border:1px solid var(--border);
          border-radius:10px; padding:8px 10px; width:100%; text-align:left; color:var(--text);}
  .tl-opt .nm{flex:1; min-width:0; font-size:13.5px; font-weight:600;}
  .tl-opt .sub{font-size:11px; color:var(--muted); margin-top:2px; display:block; font-weight:400;}
  .tl-opt .go{flex-shrink:0; font-size:16px; opacity:.75;}
  .tl-empty{font-size:12px; color:var(--warn); margin-top:6px;}

  /* Badges */
  .badges{display:flex; flex-wrap:wrap; gap:5px;}
  .pill{font-size:10.5px; font-weight:700; padding:3px 7px; border-radius:7px; background:var(--panel2); border:1px solid var(--border); color:var(--muted); white-space:nowrap;}
  .pill.book{background:#3a2a12; border-color:#6b4c1c; color:#ffc978;}
  .pill.time{background:#12283a; border-color:#22496b; color:#8fc9ff;}
  .pill.dur{background:#1d2430;}
  .pill.in{background:#1b2b25; border-color:#2c4a37; color:#7fe0ac;}
  .pill.out{background:#2b2418; border-color:#4a3a1e; color:#ffcf8a;}
  .pill.star{background:#2a2413; border-color:#544413; color:#ffd97a;}
  .pill.eur{background:#20262f;}
  .pill.kid{background:#231f33; border-color:#3d3459; color:#c2b0ff;}

  /* 3 — Hôtel */
  .hotel .nm{font-size:18px; font-weight:800; line-height:1.2;}
  .hotel .ad{font-size:13px; color:var(--muted); margin-top:4px; line-height:1.4;}
  .flags{display:flex; flex-wrap:wrap; gap:6px; margin-top:10px;}

  .big-btn{display:flex; align-items:center; justify-content:center; gap:8px; width:100%; padding:14px; border-radius:12px;
           font-size:15px; font-weight:700; text-decoration:none; background:var(--accent); color:#08130d; margin-bottom:8px;}
  .big-btn.blue{background:var(--accent2); color:#081522;}
  .big-btn.ghost{background:var(--panel2); color:var(--text); border:1px solid var(--border);}
  .big-btn:last-child{margin-bottom:0;}
  .btn-row{display:flex; gap:8px;} .btn-row .big-btn{margin-bottom:0;}

  /* 4 — Ressources */
  .res{display:flex; align-items:center; gap:10px; background:var(--panel2); border:1px solid var(--border);
       border-radius:11px; padding:10px; width:100%; text-align:left; color:var(--text); margin-bottom:8px;}
  .res:last-child{margin-bottom:0;}
  .res .ic{flex-shrink:0; font-size:19px;}
  .res .bd{flex:1; min-width:0;}
  .res .nm{font-size:14px; font-weight:700; line-height:1.25;}
  .res .badges{margin-top:5px;}
  .res .go{flex-shrink:0; color:var(--muted); font-size:17px;}
  .sub-h{font-size:11.5px; text-transform:uppercase; letter-spacing:.6px; color:var(--muted); font-weight:700; margin:14px 0 8px;}
  .sub-h:first-child{margin-top:0;}
  .empty{font-size:12.5px; color:var(--muted); font-style:italic; padding:4px 0;}

  /* Planning / Restos */
  .pl-day{display:flex; gap:10px; padding:11px 12px; background:var(--panel); border:1px solid var(--border);
          border-radius:12px; margin-bottom:8px; width:100%; text-align:left; color:var(--text);}
  .pl-day.now{border-color:var(--accent);}
  .pl-day .d{flex:0 0 46px; text-align:center;}
  .pl-day .d .n{font-size:17px; font-weight:800; line-height:1;} .pl-day .d .w{font-size:10px; color:var(--muted); text-transform:uppercase;}
  .pl-day .b{flex:1; min-width:0;}
  .pl-day .b .t{font-size:14px; font-weight:700;} .pl-day .b .s{font-size:11.5px; color:var(--muted); margin-top:2px;}
  .filters{display:flex; gap:6px; overflow-x:auto; padding-bottom:10px;}
  .filters::-webkit-scrollbar{display:none;}
  .filters button{flex-shrink:0; background:var(--panel2); border:1px solid var(--border); color:var(--muted); border-radius:20px; padding:7px 13px; font-size:12.5px;}
  .filters button.on{background:var(--accent); border-color:var(--accent); color:#08130d; font-weight:700;}

  /* Barre d'onglets */
  .tabbar{flex-shrink:0; display:flex; background:var(--panel); border-top:1px solid var(--border);
          padding-bottom:var(--safe-bottom); position:fixed; bottom:0; left:0; right:0; z-index:40;}
  .tabbar button{flex:1; background:none; color:var(--muted); padding:9px 0 8px; font-size:10.5px; display:flex; flex-direction:column; align-items:center; gap:2px;}
  .tabbar button .ic{font-size:19px;}
  .tabbar button.active{color:var(--accent);}

  /* Fiche coulissante */
  .modal-overlay{position:fixed; inset:0; background:rgba(0,0,0,.62); z-index:100; display:flex; align-items:flex-end;}
  .modal-sheet{background:var(--panel); width:100%; max-height:92dvh; overflow-y:auto; border-radius:20px 20px 0 0;
               padding:8px 16px calc(24px + var(--safe-bottom)); animation:up .22s ease-out;}
  @keyframes up{from{transform:translateY(100%);}to{transform:translateY(0);}}
  .grab{width:38px; height:4px; background:var(--border); border-radius:2px; margin:6px auto 12px;}
  .sheet-h{font-size:19px; font-weight:800; margin:0 0 4px; line-height:1.25;}
  .sheet-s{font-size:12.5px; color:var(--muted); margin-bottom:12px;}
  .sheet-p{font-size:14px; line-height:1.55; color:#c8cfdb; margin:10px 0;}
  .info-line{display:flex; justify-content:space-between; align-items:center; padding:9px 0; border-bottom:1px solid var(--border); gap:10px;}
  .info-line:last-child{border-bottom:none;}
  .info-line .label{font-size:12px; color:var(--muted); flex-shrink:0;}
  .info-line .value{font-size:14.5px; font-weight:600; text-align:right; word-break:break-word;}
  .copy-btn{background:var(--panel2); border:1px solid var(--border); color:var(--text); border-radius:8px; padding:5px 10px; font-size:12px; flex-shrink:0;}
  .copy-btn.copied{background:var(--accent); color:#08130d; border-color:var(--accent);}
  .lang{display:flex; gap:6px; margin-bottom:12px;}
  .lang button{flex:1; background:var(--panel2); border:1px solid var(--border); color:var(--muted); border-radius:9px; padding:8px; font-size:13px; font-weight:700;}
  .lang button.on{background:var(--accent2); border-color:var(--accent2); color:#081522;}
  .warnbox{background:#2b2113; border:1px solid #5c3d15; border-radius:10px; padding:10px 12px; font-size:12.5px; color:#ffce88; line-height:1.5; margin:10px 0;}
</style>
</head>
<body>

<header>
  <div class="trip-title" id="tripTitle">Irlande — Août 2026</div>
  <div class="day-strip" id="dayStrip"></div>
  <div class="day-nav">
    <button id="prevDay" aria-label="Jour précédent">‹</button>
    <div class="day-label"><div class="big" id="dayBig">—</div><div class="sub" id="daySub">—</div></div>
    <button id="nextDay" aria-label="Jour suivant">›</button>
  </div>
</header>

<main id="view"></main>

<nav class="tabbar">
  <button data-tab="today" class="active"><span class="ic">📍</span>Journée</button>
  <button data-tab="planning"><span class="ic">🗺️</span>Planning</button>
  <button data-tab="restos"><span class="ic">🍽️</span>Adresses</button>
</nav>

<div class="modal-overlay hidden" id="modalOverlay"><div class="modal-sheet" id="modalSheet"></div></div>

<script>

  if(!cfg || el._map) return;
  var tiles = el.querySelector('.tiles'), svg = el.querySelector('svg');
  var st = {z:6, cx:0, cy:0}, failed = 0, loaded = 0;

  function fit(){
    var w = el.clientWidth || 340, h = el.clientHeight || 230;
    var all = cfg.points.slice();
    var lats = all.map(function(p){ return p.lat; }), lngs = all.map(function(p){ return p.lng; });
    var laMin = Math.min.apply(null,lats), laMax = Math.max.apply(null,lats);
    var loMin = Math.min.apply(null,lngs), loMax = Math.max.apply(null,lngs);
    var pad = cfg.padding == null ? 54 : cfg.padding;
    var z = cfg.maxZoom || 15;
    while(z > 4){
      var dx = (lon2tx(loMax,z)-lon2tx(loMin,z))*256, dy = (lat2ty(laMin,z)-lat2ty(laMax,z))*256;
      if(dx <= w-pad && dy <= h-pad) break;
      z--;
    }
    st.z = z; st.cx = (lon2tx(loMin,z)+lon2tx(loMax,z))/2; st.cy = (lat2ty(laMin,z)+lat2ty(laMax,z))/2;
  }
  function px(p){ var w = el.clientWidth, h = el.clientHeight;
    return {x:(lon2tx(p.lng,st.z)-st.cx)*256 + w/2, y:(lat2ty(p.lat,st.z)-st.cy)*256 + h/2}; }

  function render(){
    var w = el.clientWidth, h = el.clientHeight, n = Math.pow(2, st.z);
    var left = st.cx*256 - w/2, top = st.cy*256 - h/2;
    var x0 = Math.floor(left/256), x1 = Math.floor((left+w)/256);
    var y0 = Math.max(0, Math.floor(top/256)), y1 = Math.min(n-1, Math.floor((top+h)/256));
    var t = '';
    for(var x = x0; x <= x1; x++) for(var y = y0; y <= y1; y++){
      var tx = ((x % n) + n) % n;
      t += '<img alt="" loading="lazy" src="https://tile.openstreetmap.org/' + st.z + '/' + tx + '/' + y + '.png"'
         + ' style="left:' + (x*256-left) + 'px;top:' + (y*256-top) + 'px">';
    }
    tiles.innerHTML = t;
    Array.prototype.forEach.call(tiles.querySelectorAll('img'), function(img){
      // Hors ligne (avion, campagne irlandaise), une tuile ratée laisserait une
      // image cassée : on la retire et on prévient, les points restent lisibles.
      img.addEventListener('error', function(){ img.remove(); failed++; flag(); });
      img.addEventListener('load', function(){ loaded++; flag(); });
    });

    var s = '';
    // Une carte peut porter plusieurs tracés (vue Planning : le tour d'ensemble
    // en grisé, la journée active en couleur par-dessus) ; cfg.path reste le
    // raccourci pour un tracé unique.
    var paths = cfg.paths || (cfg.path ? [{points:cfg.path, color:COL.step, width:2.5, dash:'7 5', opacity:.8}] : []);
    paths.forEach(function(pl){
      if(!pl || !pl.points || pl.points.length < 2) return;
      var pp = pl.points.map(function(p){ var q = px(p); return q.x.toFixed(1) + ',' + q.y.toFixed(1); }).join(' ');
      s += '<polyline points="' + pp + '" fill="none" stroke="' + (pl.color || COL.step) + '" '
         + 'stroke-width="' + (pl.width || 2.5) + '" stroke-opacity="' + (pl.opacity == null ? .8 : pl.opacity) + '"'
         + (pl.dash ? ' stroke-dasharray="' + pl.dash + '"' : '') + ' stroke-linejoin="round"/>';
    });
    // Les points d'étape passent en dernier : ils portent le repère de couchage
    // et ne doivent pas disparaître sous une pastille de restaurant voisine.
    var ordered = cfg.points.slice().sort(function(a,b){
      var wf = function(k){ return (k === 'step' || k === 'ferry') ? 1 : 0; };
      return wf(a.kind) - wf(b.kind);
    });
    ordered.forEach(function(p){
      var q = px(p);
      if(q.x < -40 || q.y < -40 || q.x > w+40 || q.y > h+40) return;
      // Vue Planning : les points hors du jour actif sont grisés plutôt que
      // retirés, pour garder le tour d'ensemble lisible en fond.
      var c = p.muted ? MUTED : (COL[p.kind] || COL.activite);
      var r = (p.kind === 'step' || p.kind === 'ferry' || p.num) ? 12 : 8;
      s += '<g class="hit" data-pick="' + esc(p.id || '') + '" opacity="' + (p.muted ? '.55' : '1') + '">'
         + '<circle cx="' + q.x.toFixed(1) + '" cy="' + q.y.toFixed(1) + '" r="' + r + '" fill="' + c + '" '
         + 'stroke="#0d1220" stroke-width="2"' + (p.approx ? ' stroke-dasharray="3 2"' : '') + '>'
         + '<title>' + esc(p.label || '') + '</title></circle>'
         + (p.num ? '<text x="' + q.x.toFixed(1) + '" y="' + (q.y+4).toFixed(1) + '" text-anchor="middle" '
                  + 'font-size="11" font-weight="800" fill="#08101f">' + esc(p.num) + '</text>' : '')
         + '</g>';
    });
    svg.innerHTML = s;
  }
  function flag(){
    var note = el.querySelector('.note.warn');
    if(failed > 0 && loaded === 0){
      if(!note){ note = document.createElement('div'); note.className = 'note warn'; el.appendChild(note); }
      note.textContent = 'Fond de carte hors ligne — les points restent placés';
    } else if(note && loaded > 0) note.remove();
  }

  fit(); render();
  el._map = {render:render, fit:fit};
  svg.addEventListener('click', function(e){
    var g = e.target.closest('[data-pick]');
    if(g && g.dataset.pick){ e.stopPropagation(); openPick(g.dataset.pick); }
  });
  if(cfg.href){
    el.addEventListener('click', function(e){
      if(e.target.closest('[data-pick]')) return;
      window.open(cfg.href, '_blank', 'noopener');
    });
  }
}

  rzT = setTimeout(function(){

  }, 200);

function openPick(id){
  if(!id) return;
  var m = /^item:(.+)$/.exec(id); if(m) return showItem(m[1]);
  var s = /^step:(.+)$/.exec(id); if(s) return (isFerryStep(step(s[1])) ? showFerry(s[1]) : showHotel(s[1]));
}

/* --------------------------------------------------- lien Maps d'un tour --- */
function coordStr(c){ return c.lat.toFixed(5) + ',' + c.lng.toFixed(5); }
function loopLink(plan, pts){
  if(plan && plan.routeMapsLink) return plan.routeMapsLink;
  var withC = pts.filter(function(p){ return isFinite(p.lat); });
  if(withC.length < 2) return '';
  var o = withC[0], d = withC[withC.length-1], mid = withC.slice(1, -1).slice(0, 8);
  var u = 'https://www.google.com/maps/dir/?api=1&origin=' + coordStr(o) + '&destination=' + coordStr(d);
  if(mid.length) u += '&waypoints=' + mid.map(coordStr).join('%7C');
  return u + '&travelmode=driving';
}
function navLink(o){
  if(o && o.mapsLink) return o.mapsLink;
  if(hasCoord(o)) return 'https://www.google.com/maps/dir/?api=1&destination=' + coordStr(o.coord) + '&travelmode=driving';
  if(o && o.address) return 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(o.address);
  return '';
}

  overlay.classList.remove('hidden');
  if(!sheetOpen){ sheetOpen = true; try{ history.pushState({sheet:true}, '', '#detail'); }catch(e){} }

}

function line(label, value, copy){
  if(!value) return '';
  return '<div class="info-line"><span class="label">' + esc(label) + '</span>'
       + '<span class="value">' + esc(value) + '</span>'
       + (copy ? '<button class="copy-btn" data-copy="' + esc(value) + '">copier</button>' : '') + '</div>';
}
function bindSheet(){
  sheetEl.querySelectorAll('[data-copy]').forEach(function(b){
    b.addEventListener('click', function(){
      var t = b.dataset.copy;
      var done = function(){ b.textContent = 'copié ✓'; b.classList.add('copied');
        setTimeout(function(){ b.textContent = 'copier'; b.classList.remove('copied'); }, 1400); };
      if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(done, done);
      else { var ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select();
             try{ document.execCommand('copy'); }catch(e){} document.body.removeChild(ta); done(); }
    });
  });
  sheetEl.querySelectorAll('[data-lang]').forEach(function(b){
    b.addEventListener('click', function(){ lsSet(LS_LANG, b.dataset.lang); if(sheetEl._re) sheetEl._re(); });
  });
  sheetEl.querySelectorAll('[data-goitem]').forEach(function(b){
    b.addEventListener('click', function(){ showItem(b.dataset.goitem); });
  });
}

/* ============================ VUE JOURNÉE ================================= */
var curDay = (function(){
  var saved = lsGet(LS_DAY, null);
  if(saved && DAYS.indexOf(saved) >= 0) return saved;
  var today = date2iso(new Date());
  if(DAYS.indexOf(today) >= 0) return today;
  return DAYS[0];
})();

function chipKind(iso){
  var c = context(iso), pl = plansOf(iso, c);
  if(c.kind === 'ferry') return 'ferry';
  if(c.kind === 'transit') return 'transit';
  if(!pl.forced && pl.options.length > 1) return 'multi';
  return 'camp';
}

function renderHeader(){
  var strip = document.getElementById('dayStrip');
  strip.innerHTML = DAYS.map(function(iso){
    var d = iso2date(iso);
    return '<button class="day-chip' + (iso === curDay ? ' active' : '') + '" data-day="' + iso + '">'
      + WD[d.getUTCDay()] + '<span class="dnum">' + d.getUTCDate() + '</span>'
      + '<span class="dot ' + chipKind(iso) + '"></span></button>';
  }).join('');
  var act = strip.querySelector('.day-chip.active');
  if(act) act.scrollIntoView({block:'nearest', inline:'center'});
  var c = context(curDay);
  document.getElementById('dayBig').textContent = fmtLong(curDay);
  document.getElementById('daySub').textContent = ctxLabel(c) + ' · ' + ctxTitle(c);
  document.getElementById('prevDay').disabled = DAYS.indexOf(curDay) <= 0;
  document.getElementById('nextDay').disabled = DAYS.indexOf(curDay) >= DAYS.length-1;
}

/* --- 1. entête de contexte ------------------------------------------------ */
function ctxBlock(c){
  var meta = [];
  if(c.kind === 'transit'){
    var leg = c.to.leg;
    if(leg && leg.distanceKm) meta.push('🚗 ' + leg.distanceKm + ' km' + (leg.durationMin ? ' · ' + durTxt(leg.durationMin) + ' de route' : ''));
    meta.push('🛏 nuit à ' + shortName(c.to.name));
  } else if(c.kind === 'ferry'){
    var f = c.step.ferry || {};
    if(f.departTime) meta.push('⛴ départ ' + f.departTime);
    if(f.checkInTime) meta.push('🎫 enregistrement ' + f.checkInTime);
  } else if(c.kind === 'camp' && c.step){
    var n = Math.round((iso2date(c.step.departure) - iso2date(c.step.arrival)) / 86400000);
    var day = Math.round((iso2date(curDay) - iso2date(c.step.arrival)) / 86400000) + 1;
    meta.push('🛏 nuit ' + day + ' sur ' + n);
    if(c.step.hotel) meta.push('🏠 ' + c.step.hotel.name);
  }
  var cls = c.kind === 'transit' ? 'transit' : (c.kind === 'ferry' ? 'ferry' : '');
  var name = c.kind === 'transit'
    ? esc(shortName(c.from.name)) + ' <span class="arrow">→</span> ' + esc(shortName(c.to.name))
    : esc(ctxTitle(c));
  return '<div class="ctx ' + cls + '"><div class="kind">' + esc(ctxLabel(c)) + '</div>'
       + '<div class="name">' + name + '</div>'
       + (meta.length ? '<div class="meta">' + meta.map(function(m){ return '<span>' + esc(m) + '</span>'; }).join('') + '</div>' : '')
       + '</div>';
}

/* --- 2. choix de journée -------------------------------------------------- */
function optCard(p, sel){
  var nb = (p.entries || []).filter(function(e){ return e.kind === 'activite'; }).length;
  var meta = [];
  if(nb) meta.push(nb + ' activité' + (nb > 1 ? 's' : ''));
  if(p.distance) meta.push(p.distance);
  var booked = (p.entries || []).filter(function(e){ var i = e.itemId && item(e.itemId); return i && i.booking && i.booking.time; });
  booked.forEach(function(e){ meta.push('🎟 ' + item(e.itemId).booking.time); });
  return '<button class="opt' + (sel ? ' sel' : '') + '" data-pickplan="' + esc(p.id) + '">'
    + '<div class="t">' + esc(p.title || 'Journée') + '</div>'
    + (p.subtitle ? '<div class="s">' + esc(p.subtitle) + '</div>' : '')
    + (meta.length ? '<div class="m">' + meta.map(function(m){ return '<span class="pill">' + esc(m) + '</span>'; }).join('') + '</div>' : '')
    + '</button>';
}

/* --- 3+4. la journée : carte puis déroulé --------------------------------- */
function planPoints(plan, c){
  var pts = [], path = [], n = 0;
  var start = c.kind === 'transit' ? c.from : c.step;
  var end = c.kind === 'transit' ? c.to : c.step;
  if(hasCoord(start)) { var ps = {lat:start.coord.lat, lng:start.coord.lng, kind:isFerryStep(start)?'ferry':'step',
      label:shortName(start.name), id:'step:'+start.id}; pts.push(ps); path.push(ps); }
  (plan.entries || []).forEach(function(e){
    var it = e.itemId && item(e.itemId);
    if(it && hasCoord(it)){
      n++;
      var p = {lat:it.coord.lat, lng:it.coord.lng, approx:it.coord.approx,
               kind: it.type === 'course' ? 'shop' : (it.type === 'resto' ? 'resto' : 'activite'),
               label:it.name, id:'item:'+it.id, num:String(n)};
      pts.push(p); path.push(p);
    }
    (e.options || []).forEach(function(oid){
      var o = item(oid);
      if(o && hasCoord(o)) pts.push({lat:o.coord.lat, lng:o.coord.lng, approx:o.coord.approx,
        kind:'resto', label:o.name, id:'item:'+o.id});
    });
  });
  if(end && end !== start && hasCoord(end)){ var pe = {lat:end.coord.lat, lng:end.coord.lng,
      kind:isFerryStep(end)?'ferry':'step', label:shortName(end.name), id:'step:'+end.id};
    pts.push(pe); path.push(pe); }
  else if(end === start && hasCoord(start)) path.push(path[0]);
  return {points:pts, path:path};
}

      }).join('') + '</div>';
    } else {
      body += '<div class="tl-empty">Aucune adresse retenue — voir les adresses de l\'étape en bas de page.</div>';

      + '<span class="nm">Détail &amp; adresse</span><span class="go">›</span></button></div>';
  }

    + '<div class="tl-line"><i class="' + dot + '"></i></div>'
    + '<div class="tl-body">' + body + '</div></div>';
}

function planBlock(plan, c, several){
  var pp = planPoints(plan, c);
  var href = loopLink(plan, pp.path);
  var map = mapSlot({points:pp.points, path:pp.path, href:href}, 'jour');
  var ents = plan.entries || [];
  // Segments de route entre arrêts, calculés dans l'ordre du déroulé : chaque
  // ligne "Départ"/"activité"/"Retour" porte les coordonnées de son point,
  // et on affiche le trajet depuis le point précédent quand les deux sont connus.
  var start = c.kind === 'transit' ? c.from : c.step;
  var end = c.kind === 'transit' ? c.to : c.step;
  var prevCoord = hasCoord(start) ? start.coord : null;
  var rowsHtml = ents.map(function(e, i){
    var coord = null;
    if(e.kind === 'retour') coord = hasCoord(end) ? end.coord : null;
    else if(e.itemId){ var it = item(e.itemId); if(hasCoord(it)) coord = it.coord; }
    var seg = '';
    if(i > 0 && prevCoord && coord){
      var km = roadKm(prevCoord, coord);
      seg = segHtml(travelMin(km), km);
    }
    if(coord) prevCoord = coord;
    return entryRow(e, i === 0, i === ents.length - 1, seg);
  }).join('');
  return '<div class="card">'
    + '<div class="jour-head"><div><div class="t">' + esc(plan.title || 'La journée') + '</div>'
      + (plan.subtitle ? '<div class="s">' + esc(plan.subtitle) + '</div>' : '')
      + (plan.distance ? '<div class="s">' + esc(plan.distance) + '</div>' : '')
      + '</div>'
      + (several ? '<button class="swapbtn" data-swap="1">changer</button>' : '') + '</div>'
    + map
    + (map ? (href ? '<a class="maproute" href="' + esc(href) + '" target="_blank" rel="noopener">🗺️ Itinéraire complet dans Maps</a>' : '')
           + '<div class="maphint">Touchez un point pour le détail et l\'adresse.</div>' : '')
    + '<div class="tl">' + rowsHtml + '</div>'
    + '</div>';
}

/* --- la traversée, en carte complète et autonome -------------------------- */
// Utilisée à la fois en tête de page les jours de pure traversée et en bas de
// page l'hôtel du soir quand on dort à bord : mêmes informations, sans avoir
// à ouvrir la fiche, pour ne jamais l'afficher deux fois dans la journée.
function ferryFullCard(fs){
  var f = fs.ferry || {};
  return '<div class="card"><h3>⛴ La traversée</h3>'
    + '<div class="hotel"><div class="nm">' + esc(f.from || '') + ' → ' + esc(f.to || '') + '</div>'
    + (f.ship || f.cabin ? '<div class="ad">' + esc([f.ship, f.cabin].filter(Boolean).join(' · ')) + '</div>' : '')
    + '<div class="flags">' + (f.departTime ? pill('time', '⛴ départ ' + f.departTime) : '')
      + (f.checkInTime ? pill('time', '🎫 enregistrement ' + f.checkInTime) : '')
      + (f.arriveTime ? pill('time', '⚓ arrivée ' + f.arriveTime) : '')
      + (f.ref ? pill('book', '🎟 ' + f.ref) : '') + '</div></div>'
    + '<div style="height:10px"></div>'
    + (f.mapsLink ? '<a class="big-btn blue" href="' + esc(f.mapsLink) + '" target="_blank" rel="noopener">🧭 ' + esc(f.mapsLabel || 'Terminal') + '</a>' : '')
    + '<button class="big-btn ghost" data-ferry="' + esc(fs.id) + '">🎟 Fiche traversée</button></div>';
}

/* --- 5+6. fin de journée : logement, où manger, courses, laverie --------- */
// Un seul bloc plutôt que deux (règle du 30 juillet) : la carte réunit le
// logement et tout ce qui gravite autour, puis chaque section n'apparaît que
// si elle a quelque chose à montrer.
function commoditesOfStep(id){ return itemsOfStep(id).filter(function(i){ return i.type === 'commodite'; }); }

function resRow(it, icon){
  var sub = it.type === 'resto'
    ? [it.cuisine, it.priceAdult].filter(Boolean).join(' · ')
    : (it.type === 'commodite' && it.category ? it.category : (it.description || '').slice(0, 70));
  return '<button class="res" data-detail="' + esc(it.id) + '">'
    + '<span class="ic">' + icon + '</span><span class="bd"><span class="nm">' + esc(it.name) + '</span>'
    + (sub ? '<div class="tl-n">' + esc(sub) + '</div>' : '')
    + badgesFor(it) + '</span><span class="go">›</span></button>';
}

function finDeJourneeBlock(c, plan){
  // Jour de pure traversée : la carte "La traversée" est déjà en tête de
  // page, pas besoin de la répéter ici.
  if(c.kind === 'ferry') return '';
  var s = c.sleep;
  if(!s) return '<div class="card"><h3>🌙 Fin de journée</h3><div class="empty">Nuit à bord ou retour à la maison.</div></div>';
  if(isFerryStep(s)) return ferryFullCard(s);

  var h = s.hotel;
  var restos = restosOfStep(s.id), shops = shopsOfStep(s.id), commodites = commoditesOfStep(s.id);
  if(!h && !restos.length && !shops.length && !commodites.length) return '';
  var laveries = commodites.filter(function(i){ return /laverie/i.test(i.category || ''); });
  var autres = commodites.filter(function(i){ return !/laverie/i.test(i.category || ''); });
  var retained = (plan && plan.dinnerOptions) || [];
  restos.sort(function(a,b){ return (retained.indexOf(b.id) >= 0) - (retained.indexOf(a.id) >= 0); });

  // Carte : le logement, plus resto / courses / laverie qui ont leurs propres
  // coordonnées — une laverie sans coordonnées propres est censée être sur
  // place, donc déjà couverte par le point du logement.
  var pts = [];
  if(hasCoord(s)) pts.push({lat:s.coord.lat, lng:s.coord.lng, kind:isFerryStep(s) ? 'ferry' : 'step', label:(h && h.name) || shortName(s.name), id:'step:'+s.id});
  restos.forEach(function(r){ if(hasCoord(r)) pts.push({lat:r.coord.lat, lng:r.coord.lng, approx:r.coord.approx, kind:'resto', label:r.name, id:'item:'+r.id}); });
  shops.forEach(function(r){ if(hasCoord(r)) pts.push({lat:r.coord.lat, lng:r.coord.lng, approx:r.coord.approx, kind:'shop', label:r.name, id:'item:'+r.id}); });
  commodites.forEach(function(r){ if(hasCoord(r)) pts.push({lat:r.coord.lat, lng:r.coord.lng, approx:r.coord.approx, kind:'commodite', label:r.name, id:'item:'+r.id}); });
  var nav = h ? navLink({mapsLink:h.mapsLink, address:h.address, coord:s.coord}) : '';
  var map = pts.length ? mapSlot({points:pts, maxZoom:14, padding:80, href:nav}, 'small') : '';

  var html = '<div class="card"><h3>🌙 Fin de journée, à ' + esc(shortName(s.name)) + '</h3>' + map;

  if(h){
    var flags = [];
    if(h.arrivalWindow) flags.push(pill('time', '🔑 ' + h.arrivalWindow));
    if(h.breakfast) flags.push(pill(/non/i.test(h.breakfast) ? 'out' : 'in', '🥐 ' + (/non/i.test(h.breakfast) ? 'pas de petit-déj' : 'petit-déj inclus')));
    if(h.foodOnSite) flags.push(pill('in', '🍽️ dîner sur place'));
    if(h.selfCatering) flags.push(pill('out', '🍳 cuisine — courses à prévoir'));
    html += (map ? '<div style="height:10px"></div>' : '')
      + '<div class="hotel"><div class="nm">' + esc(h.name) + '</div>'
      + (h.address ? '<div class="ad">' + esc(h.address) + '</div>' : '')
      + (flags.length ? '<div class="flags">' + flags.join('') + '</div>' : '') + '</div>'
      + '<div style="height:10px"></div>'
      + (nav ? '<a class="big-btn blue" href="' + esc(nav) + '" target="_blank" rel="noopener">🧭 Aller à l\'hôtel</a>' : '')
      + '<button class="big-btn ghost" data-hotel="' + esc(s.id) + '">🎟 Fiche &amp; réservation</button>';
    if(h.foodOnSite) html += '<div class="warnbox">🍽️ L\'hébergement sert à dîner sur place — les adresses ci-dessous sont un plan B.</div>';
    if(h.selfCatering) html += '<div class="warnbox">🍳 Cuisine dans le logement et aucun petit-déjeuner fourni : penser aux courses.</div>';
  }

  if(restos.length) html += '<div class="sub-h">Où manger</div>' + restos.map(function(r){ return resRow(r, '🍽️'); }).join('');
  if(shops.length) html += '<div class="sub-h">Où faire ses courses</div>' + shops.map(function(r){ return resRow(r, '🛒'); }).join('');
  if(laveries.length) html += '<div class="sub-h">Où laver le linge</div>' + laveries.map(function(r){ return resRow(r, '🧺'); }).join('');
  if(autres.length) html += '<div class="sub-h">Autres commodités</div>' + autres.map(function(r){ return resRow(r, '🧰'); }).join('');

  return html + '</div>';
}

/* --- assemblage ----------------------------------------------------------- */
function renderDay(){
  var c = context(curDay);
  var f = planFor(curDay, c);
  var html = ctxBlock(c);

  if(c.kind === 'ferry'){
    // Jour de pure traversée : une seule carte, tout en haut, avec tout ce
    // qu'il faut sans avoir à ouvrir de fiche. Elle n'est pas répétée plus bas.
    html += ferryFullCard(c.step);
  }

  if(f.plan){
    html += planBlock(f.plan, c, f.options.length > 1);
  } else if(f.options.length > 1){
    html += '<div class="card"><h3>🧭 Choisir la journée</h3>'
      + '<div class="opts">' + f.options.map(function(p){ return optCard(p, false); }).join('') + '</div></div>';
  } else if(c.kind !== 'fin' && c.kind !== 'ferry'){
    // Rien de programmé : on propose au moins ce qui est rattaché à l'étape —
    // et si même ça n'existe pas, on n'affiche rien plutôt qu'un bloc vide.
    var pool = c.kind === 'transit' ? itemsOfTransit(c.from.id, c.to.id)
             : (c.step ? itemsOfStep(c.step.id).filter(function(i){ return i.type === 'activite'; }) : []);
    if(pool.length){
      html += '<div class="card"><h3>🧭 Dans le coin</h3>' + pool.map(function(i){ return resRow(i, '📍'); }).join('') + '</div>';
    }
  }

  html += finDeJourneeBlock(c, f.plan);
  document.getElementById('view').innerHTML = html;
  mountMaps();
}

/* ============================ PLANNING ==================================== */
function planningMapCfg(c, f){
  var stepPts = STEPS.map(function(s, i){
    if(!hasCoord(s)) return null;
    return {lat:s.coord.lat, lng:s.coord.lng, kind:isFerryStep(s) ? 'ferry' : 'step',
            label:shortName(s.name), id:'step:' + s.id, num:String(i + 1)};
  }).filter(Boolean);

  var hiIds = {};
  if(c.kind === 'transit'){ hiIds['step:' + c.from.id] = 1; hiIds['step:' + c.to.id] = 1; }
  else if(c.step){ hiIds['step:' + c.step.id] = 1; }
  var points = stepPts.map(function(p){ return hiIds[p.id] ? p : Object.assign({}, p, {muted:true}); });

  var hiPath = [];
  if(f.plan){
    var pp = planPoints(f.plan, c);
    hiPath = pp.path;
    points = points.concat(pp.points.filter(function(p){ return p.id.indexOf('item:') === 0; }));
  } else if(c.kind === 'transit'){
    if(hasCoord(c.from)) hiPath.push({lat:c.from.coord.lat, lng:c.from.coord.lng});
    if(hasCoord(c.to)) hiPath.push({lat:c.to.coord.lat, lng:c.to.coord.lng});
  }

  return {
    points: points,
    paths: [
      {points:stepPts, color:MUTED, width:2, dash:'4 4', opacity:.6},
      hiPath.length > 1 ? {points:hiPath, color:COL.step, width:3.5, dash:'', opacity:1} : null
    ].filter(Boolean),
    maxZoom:9, padding:26
  };
}

function renderPlanning(){
  var c = context(curDay), f = planFor(curDay, c);
  var overview = mapSlot(planningMapCfg(c, f), 'big');
  var html = overview
    ? '<div class="card"><h3>🗺️ Le tour d\'ensemble</h3>' + overview
      + '<div class="maphint">' + esc(ctxTitle(c)) + ' en surbrillance — touchez un point pour le détail.</div></div>'
    : '';
  html += '<h3 style="font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin:0 0 10px">Les 17 jours</h3>';
  html += DAYS.map(function(iso){
    var dc = context(iso), df = planFor(iso, dc), d = iso2date(iso);
    var t = df.plan ? (df.plan.title || ctxTitle(dc)) : (df.options.length > 1 ? df.options.length + ' options à choisir' : ctxTitle(dc));
    var s = ctxLabel(dc) + (df.plan && df.options.length > 1 ? ' · ' + ctxTitle(dc) : '')
          + (dc.sleep && dc.sleep.hotel ? ' · 🛏 ' + shortName(dc.sleep.name) : '');
    return '<button class="pl-day' + (iso === curDay ? ' now' : '') + '" data-day="' + iso + '">'
      + '<span class="d"><span class="n">' + d.getUTCDate() + '</span><span class="w">' + WD[d.getUTCDay()] + '</span></span>'
      + '<span class="b"><span class="t">' + esc(t) + '</span><span class="s">' + esc(s) + '</span></span></button>';
  }).join('');
  document.getElementById('view').innerHTML = html;
  mountMaps();
}

/* ============================ ADRESSES ==================================== */
var restoFilter = 'all', restoScope = 'day';
function uniqueSteps(list){
  var seen = {}, out = [];
  list.forEach(function(s){ if(s && !isFerryStep(s) && !seen[s.id]){ seen[s.id] = 1; out.push(s); } });
  return out;
}
function renderRestos(){
  var c = context(curDay);
  // Filtrée par défaut sur l'étape de la date active dans la frise : c'est
  // elle qui compte quand on cherche où manger ce soir-là, pas les 17 jours.
  var daySteps = uniqueSteps([c.sleep, c.kind === 'transit' ? c.from : null]);
  var steps = restoScope === 'day' ? daySteps : STEPS.filter(function(s){ return !isFerryStep(s); });

  var filters = '<div class="filters">'
    + '<button data-rf="all" class="' + (restoFilter === 'all' ? 'on' : '') + '">Tout</button>'
    + '<button data-rf="kids" class="' + (restoFilter === 'kids' ? 'on' : '') + '">Menu enfant</button>'
    + '<button data-rf="shop" class="' + (restoFilter === 'shop' ? 'on' : '') + '">Courses</button></div>'
    + '<div class="filters">'
    + '<button data-rs="day" class="' + (restoScope === 'day' ? 'on' : '') + '">' + esc(ctxTitle(c)) + '</button>'
    + '<button data-rs="all" class="' + (restoScope === 'all' ? 'on' : '') + '">Toutes les étapes</button></div>';

  var html = steps.map(function(s){
    var rs = restoFilter === 'kids' ? restosOfStep(s.id).filter(function(r){ return r.kidsMenu; })
           : restoFilter === 'shop' ? [] : restosOfStep(s.id);
    var sh = restoFilter === 'kids' ? [] : shopsOfStep(s.id);
    if(!rs.length && !sh.length) return '';
    return '<div class="card"><h3>' + esc(shortName(s.name)) + '</h3>'
      + (rs.length ? rs.map(function(r){ return resRow(r, '🍽️'); }).join('') : '')
      + (sh.length ? '<div class="sub-h">Courses</div>' + sh.map(function(r){ return resRow(r, '🛒'); }).join('') : '')
      + '</div>';
  }).join('');

  // Les restaurants rattachés à une journée de sortie plutôt qu'à un couchage.
  var sorties = restoScope === 'day'
    ? (c.kind === 'transit' ? itemsOfTransit(c.from.id, c.to.id).filter(function(i){ return i.type === 'resto'; }) : [])
    : ITEMS.filter(function(i){ return i.type === 'resto' && i.link && i.link.kind === 'transit'; });
  if(sorties.length && restoFilter !== 'shop'){
    var ss = restoFilter === 'kids' ? sorties.filter(function(r){ return r.kidsMenu; }) : sorties;
    if(ss.length) html += '<div class="card"><h3>Sur la route</h3>' + ss.map(function(r){ return resRow(r, '🍽️'); }).join('') + '</div>';
  }
  document.getElementById('view').innerHTML = filters + (html || '<div class="empty">Rien à afficher avec ce filtre pour cette étape.</div>');
}

/* ============================ ROUTAGE ===================================== */
var tab = 'today';
function render(){
  if(tab === 'today') renderDay();
  else if(tab === 'planning') renderPlanning();
  else renderRestos();
  renderHeader();
  bindView();
}
function bindView(){
  var v = document.getElementById('view');
  v.querySelectorAll('[data-detail]').forEach(function(b){
    b.addEventListener('click', function(e){ e.stopPropagation(); showItem(b.dataset.detail); });
  });
  v.querySelectorAll('[data-hotel]').forEach(function(b){ b.addEventListener('click', function(){ showHotel(b.dataset.hotel); }); });
  v.querySelectorAll('[data-ferry]').forEach(function(b){ b.addEventListener('click', function(){ showFerry(b.dataset.ferry); }); });
  v.querySelectorAll('[data-pickplan]').forEach(function(b){
    b.addEventListener('click', function(){ setPick(curDay, b.dataset.pickplan); render(); document.getElementById('view').scrollTop = 0; });
  });
  v.querySelectorAll('[data-swap]').forEach(function(b){ b.addEventListener('click', function(){ setPick(curDay, null); render(); }); });
  v.querySelectorAll('[data-day]').forEach(function(b){
    b.addEventListener('click', function(){ go(b.dataset.day); tab = 'today'; syncTabs(); render(); });
  });
  v.querySelectorAll('[data-rf]').forEach(function(b){ b.addEventListener('click', function(){ restoFilter = b.dataset.rf; render(); }); });
  v.querySelectorAll('[data-rs]').forEach(function(b){ b.addEventListener('click', function(){ restoScope = b.dataset.rs; render(); }); });
}
function syncTabs(){
  document.querySelectorAll('.tabbar button').forEach(function(b){ b.classList.toggle('active', b.dataset.tab === tab); });
}
function go(iso){ if(DAYS.indexOf(iso) < 0) return; curDay = iso; lsSet(LS_DAY, iso); document.getElementById('view').scrollTop = 0; }

document.getElementById('dayStrip').addEventListener('click', function(e){
  var b = e.target.closest('[data-day]'); if(!b) return;
  // On garde l'onglet actif : changer de date dans la frise doit filtrer
  // l'onglet Adresses ou remettre à jour la carte du Planning, pas forcer
  // un retour sur Journée.
  go(b.dataset.day); render();
});
document.getElementById('prevDay').addEventListener('click', function(){ go(addDays(curDay, -1)); render(); });
document.getElementById('nextDay').addEventListener('click', function(){ go(addDays(curDay, 1)); render(); });
document.querySelectorAll('.tabbar button').forEach(function(b){
  b.addEventListener('click', function(){ tab = b.dataset.tab; syncTabs(); render(); });
});

// Balayage horizontal pour passer d'un jour à l'autre, sans gêner le défilement.
(function(){
  var x0 = null, y0 = null;
  var main = document.getElementById('view');
  main.addEventListener('touchstart', function(e){ if(e.touches.length !== 1) return; x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; }, {passive:true});
  main.addEventListener('touchend', function(e){
    if(x0 == null || tab !== 'today') return;
    var t = e.changedTouches[0], dx = t.clientX - x0, dy = t.clientY - y0;
    x0 = null;
    if(Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy)*2){ go(addDays(curDay, dx < 0 ? 1 : -1)); render(); }
  }, {passive:true});
})();

document.getElementById('tripTitle').textContent = TRIP.name || 'Irlande — Août 2026';
render();

if('serviceWorker' in navigator){
  window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
}
})();

</script>
</body>
